<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Urban Bees</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Erewhon's system, Urban Bees' hue */
  --bg:#FCFBF9;
  --surface:#FFFFFF;
  --tint:#F1EADF;
  --tint-deep:#E7DCCB;
  --ink:#212121;
  --ink-2:#6E6A64;
  --ink-3:#9A958D;
  --line:#E4E0D9;
  --line-2:#CFC9BF;
  --btn:#E8E7E3;
  --btn-hover:#DEDCD6;
  --accent:#A8681B;
  --deep:#1F2A1E;

  --font:'Plus Jakarta Sans','Helvetica Neue',Helvetica,Arial,sans-serif;
  --r:3px;
  --u:4px;
  --pad:clamp(20px,5vw,64px);
}

*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--ink);
  font-size:16px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  letter-spacing:-.005em;
}
img{max-width:100%}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:inherit;text-decoration:none}

.u-label{
  font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-3);
}

/* ---------- header: one dark bar, three zones ---------- */
.site-header{
  position:sticky;top:0;z-index:70;
  background:var(--deep);color:#F2EFE9;
}
.header-inner{
  max-width:1520px;margin:0 auto;padding:0 var(--pad);
  height:80px;display:grid;grid-template-columns:1fr auto 1fr;
  align-items:center;gap:20px;
}
.nav-left{display:flex;align-items:center;gap:30px}
.nav-right{justify-self:end;display:flex;align-items:center;gap:22px}
.wordmark{
  justify-self:center;color:#FFFFFF;
  font-size:19px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;
  white-space:nowrap;
}
.navlink{
  display:inline-flex;align-items:center;gap:6px;
  font-size:11.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;
  color:rgba(242,239,233,.74);padding:4px 0;
  border-bottom:1px solid transparent;transition:color .15s,border-color .15s;
}
.navlink:hover,.navlink.on{color:#FFFFFF}
.navlink.on{border-bottom-color:rgba(255,255,255,.65)}
.navlink svg{width:9px;height:9px;flex:none;transition:transform .18s}

/* dropdown */
.has-menu{position:relative}
.has-menu:hover .navlink svg,.has-menu.open .navlink svg{transform:rotate(180deg)}
.dropdown{
  position:absolute;top:100%;left:-18px;min-width:228px;
  background:var(--deep);border:1px solid rgba(255,255,255,.14);border-top:none;
  border-radius:0 0 var(--r) var(--r);
  padding:8px 0;opacity:0;visibility:hidden;transform:translateY(-4px);
  transition:opacity .16s,transform .16s,visibility .16s;
}
.has-menu:hover .dropdown,
.has-menu:focus-within .dropdown,
.has-menu.open .dropdown{opacity:1;visibility:visible;transform:translateY(0)}
.dropdown button{
  display:block;width:100%;text-align:left;padding:11px 20px;
  font-size:12px;font-weight:500;letter-spacing:.04em;
  color:rgba(242,239,233,.78);transition:color .14s,background .14s;
}
.dropdown button:hover{color:#FFFFFF;background:rgba(255,255,255,.07)}

.lang{display:flex;align-items:center;gap:6px}
.lang button{
  font-size:11px;font-weight:600;letter-spacing:.08em;
  color:rgba(242,239,233,.55);padding:3px 2px;transition:color .15s;
}
.lang button.on{color:#FFFFFF}
.lang .sep{color:rgba(242,239,233,.3);font-size:11px}
.cart-btn{
  font-size:11.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;
  display:flex;align-items:center;gap:8px;color:rgba(242,239,233,.86);transition:color .15s;
}
.cart-btn:hover{color:#FFFFFF}
.cart-count{
  min-width:19px;height:19px;padding:0 5px;border-radius:100px;
  background:#FFFFFF;color:var(--deep);
  font-size:10.5px;font-weight:700;letter-spacing:0;
  display:flex;align-items:center;justify-content:center;
}
.cart-count[hidden]{display:none}

/* mobile menu */
.menu-btn{display:none;font-size:11.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:rgba(242,239,233,.86)}
.mobile-nav{display:none;border-top:1px solid rgba(255,255,255,.14);padding:6px 0 14px}
.mobile-nav.open{display:block}
.mobile-nav button{
  display:block;width:100%;text-align:left;
  padding:12px var(--pad);font-size:12.5px;font-weight:600;
  letter-spacing:.1em;text-transform:uppercase;color:rgba(242,239,233,.8);
}
.mobile-nav .m-group{
  display:block;padding:14px var(--pad) 2px;
  font-size:11px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;
  color:rgba(242,239,233,.42);
}
.mobile-nav button.sub{
  text-transform:none;letter-spacing:.03em;font-weight:500;
  padding-left:calc(var(--pad) + 18px);color:rgba(242,239,233,.62);font-size:13px;
}

/* ---------- views ---------- */
.view{display:none}
.view.active{display:block}
.shell{max-width:1520px;margin:0 auto;padding:0 var(--pad)}

/* ---------- hero ---------- */
.hero{
  position:relative;isolation:isolate;text-align:center;
  padding:clamp(76px,11vw,140px) var(--pad) clamp(58px,8vw,100px);
  background-color:#26311F;
  background-image:url("hero-apiary.jpg");
  background-size:cover;
  background-position:center 64%;
}
/* Scrim: the type sits on a photograph, so contrast is guaranteed here
   rather than hoped for. It also softens the image's low resolution. */
.hero::before{
  content:'';position:absolute;inset:0;z-index:-1;
  background:linear-gradient(180deg,
    rgba(16,24,14,.72) 0%,
    rgba(16,24,14,.62) 44%,
    rgba(16,24,14,.80) 100%);
}
.hero-inner{max-width:900px;margin:0 auto}
.hero .u-label{display:block;margin-bottom:20px;color:rgba(255,255,255,.8)}
.hero h1{
  font-size:clamp(32px,4.8vw,52px);
  font-weight:600;line-height:1.08;letter-spacing:-.028em;
  max-width:18ch;margin:0 auto 20px;text-wrap:balance;
  color:#FFFFFF;text-shadow:0 1px 20px rgba(0,0,0,.4);
}
.hero p{
  font-size:16px;line-height:1.6;max-width:54ch;margin:0 auto;
  color:rgba(255,255,255,.9);text-shadow:0 1px 14px rgba(0,0,0,.42);
}
.hero-meta{
  display:flex;flex-wrap:wrap;justify-content:center;gap:0 40px;
  margin:40px auto 0;padding-top:26px;max-width:860px;
  border-top:1px solid rgba(255,255,255,.24);
}
.hero-meta div{padding:6px 0}
.hero-meta b{
  display:block;font-size:12.5px;font-weight:600;letter-spacing:.02em;
  color:#FFFFFF;text-shadow:0 1px 10px rgba(0,0,0,.4);
}
.hero-meta span{font-size:12px;color:rgba(255,255,255,.74)}

/* ---------- shop layout: sidebar + grid ---------- */
.shop-layout{
  display:grid;grid-template-columns:232px minmax(0,1fr);
  gap:0 56px;align-items:start;padding-top:40px;
}
.facet-bar{display:none}
.shop-layout.rail-closed{grid-template-columns:38px minmax(0,1fr);gap:0 26px}
.shop-layout.rail-closed .facets-body{display:none}
.shop-layout.rail-closed .facets-head h2,
.shop-layout.rail-closed .facets-clear{display:none}
.shop-layout.rail-closed .facets-head{padding-bottom:0;border-bottom:0}
.shop-layout.rail-closed .rail-toggle .chev{transform:rotate(180deg)}
.shop-layout.rail-closed .rail-toggle{
  width:32px;height:32px;margin-left:0;
  border:1px solid var(--line-2);background:var(--bg);color:var(--ink-2);
}
.shop-layout.rail-closed .rail-toggle:hover{background:var(--tint);color:var(--ink);border-color:var(--ink-3)}

.rail-toggle{
  width:26px;height:26px;margin-left:-5px;flex:none;position:relative;
  display:inline-flex;align-items:center;justify-content:center;
  border-radius:50%;color:var(--ink-3);
  transition:background .15s,color .15s;
}
.rail-toggle:hover{background:var(--tint);color:var(--ink)}
.rail-toggle .chev{width:11px;height:11px;transition:transform .22s}
.rail-dot{
  position:absolute;top:1px;right:1px;width:6px;height:6px;border-radius:50%;
  background:var(--accent);
}
.rail-dot[hidden]{display:none}

.facets{position:sticky;top:104px;padding-bottom:60px}
.facets-head{
  display:flex;align-items:center;gap:9px;
  padding-bottom:6px;
}
.facets-head h2{margin-right:auto}
.facets-head h2{
  font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);
}
.facets-clear{
  font-size:11.5px;color:var(--ink-3);text-decoration:underline;
  text-underline-offset:3px;transition:color .15s;
}
.facets-clear:hover{color:var(--ink)}
.facets-clear[hidden]{display:none}

.facet{border-top:1px solid var(--line)}
.facet-head{
  width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:16px 0 14px;text-align:left;
  font-size:12.5px;font-weight:600;letter-spacing:.01em;color:var(--ink);
}
.facet-head .chev{width:9px;height:9px;flex:none;transition:transform .2s;color:var(--ink-3)}
.facet.closed .chev{transform:rotate(-90deg)}
.facet-body{display:flex;flex-direction:column;gap:2px;padding-bottom:16px}
.facet.closed .facet-body{display:none}

.opt{
  display:flex;align-items:center;gap:10px;cursor:pointer;
  padding:5px 0;font-size:13.5px;color:var(--ink-2);line-height:1.45;
  transition:color .15s;
}
.opt:hover{color:var(--ink)}
.opt input{position:absolute;opacity:0;width:0;height:0}
.opt .box{
  width:15px;height:15px;flex:none;border:1px solid var(--line-2);border-radius:2px;
  background:transparent;position:relative;transition:background .15s,border-color .15s;
}
.opt .box::after{
  content:'';position:absolute;left:4px;top:.5px;width:4px;height:8px;
  border:solid #FFF;border-width:0 1.6px 1.6px 0;transform:rotate(43deg) scale(0);
  transition:transform .15s;
}
.opt input:checked + .box{background:var(--deep);border-color:var(--deep)}
.opt input:checked + .box::after{transform:rotate(43deg) scale(1)}
.opt input:focus-visible + .box{outline:2px solid var(--accent);outline-offset:2px}
.opt .n{margin-left:auto;font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.opt.off{opacity:.38;cursor:not-allowed}
.opt.off:hover{color:var(--ink-2)}

.chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 0 4px}
.chips:empty{display:none}
.chip{
  display:inline-flex;align-items:center;gap:7px;
  padding:5px 10px;border:1px solid var(--line-2);border-radius:100px;
  font-size:12px;color:var(--ink-2);transition:border-color .15s,color .15s;
}
.chip:hover{border-color:var(--ink-2);color:var(--ink)}
.chip .x{font-size:13px;line-height:1;color:var(--ink-3)}
.chips-clear{
  align-self:center;margin-left:4px;padding:5px 2px;
  font-size:12px;color:var(--ink-3);text-decoration:underline;text-underline-offset:3px;
  transition:color .15s;
}
.chips-clear:hover{color:var(--ink)}

.empty-state{padding:56px 0 90px;max-width:420px}
.empty-state p{font-size:14.5px;color:var(--ink-2);margin-bottom:16px}

/* ---------- product grid ---------- */
.grid-head{
  display:flex;align-items:baseline;justify-content:space-between;gap:16px;
  padding:18px 0 22px;
}
.grid-head h2{font-size:16px;font-weight:600;letter-spacing:-.01em}
.grid-head span{font-size:12px;color:var(--ink-3)}
.grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));
  gap:40px 24px;padding-bottom:84px;
}
.grid[hidden]{display:none}
.empty-state[hidden]{display:none}
.card{display:flex;flex-direction:column;cursor:pointer}
.tile{
  aspect-ratio:1/1;background:var(--tint);border-radius:var(--r);
  display:flex;align-items:center;justify-content:center;
  font-size:64px;line-height:1;
  transition:background .2s;
}
.card:hover .tile{background:var(--tint-deep)}
.card-region{margin-top:14px}
.card-name{
  font-size:15px;font-weight:600;line-height:1.3;margin-top:7px;letter-spacing:-.012em;
}
.card-farm{font-size:12.5px;color:var(--ink-3);margin-top:3px}
.card-foot{
  display:flex;align-items:baseline;gap:7px;margin-top:10px;
}
.card-price{font-size:14.5px;font-weight:600;font-variant-numeric:tabular-nums}
.card-unit{font-size:12px;color:var(--ink-3)}
.btn{
  width:100%;margin-top:14px;
  background:var(--btn);color:var(--ink);
  border-radius:var(--r);padding:11px 14px;
  font-size:11px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;
  transition:background .15s;
}
.btn:hover{background:var(--btn-hover)}
.btn.added{background:var(--deep);color:#F2EFE9}
.btn-outline{
  background:transparent;border:1px solid var(--ink);
}
.btn-outline:hover{background:var(--btn)}
.btn-solid{background:var(--deep);color:#F2EFE9}
.btn-solid:hover{background:#2A3829}
.btn:disabled{opacity:.5;cursor:default}

/* ---------- detail ---------- */
.back{
  display:inline-flex;align-items:center;gap:9px;padding:26px 0 0;
  font-size:11.5px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;
  color:var(--ink-2);
}
.back:hover{color:var(--ink)}
.detail{
  display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  gap:clamp(28px,5vw,72px);padding:34px 0 80px;align-items:start;
}
.detail-tile{
  aspect-ratio:1/1;background:var(--tint);border-radius:var(--r);
  display:flex;align-items:center;justify-content:center;font-size:clamp(90px,14vw,160px);
}
.detail-info h1{
  font-size:clamp(26px,3.4vw,36px);font-weight:600;line-height:1.12;
  letter-spacing:-.026em;margin:12px 0 10px;text-wrap:balance;
}
.detail-farm{font-size:14px;color:var(--ink-2)}
.detail-buy{
  display:flex;align-items:center;gap:20px;flex-wrap:wrap;
  margin:26px 0;padding:22px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
}
.detail-price{font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.detail-price span{display:block;font-size:12px;font-weight:400;color:var(--ink-3);letter-spacing:0;margin-top:2px}
.detail-buy .btn{width:auto;margin:0;min-width:190px;padding:13px 26px}
.specs{display:grid;grid-template-columns:repeat(2,1fr);gap:0}
.spec{padding:16px 0;border-bottom:1px solid var(--line)}
.spec:nth-child(odd){padding-right:18px}
.spec dt{margin-bottom:5px}
.spec dd{font-size:13.5px;font-weight:500;line-height:1.4}
.prose{padding:26px 0 0}
.prose h3{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-bottom:10px}
.prose p{font-size:14.5px;line-height:1.65;color:var(--ink-2);max-width:60ch}
.prose + .prose{margin-top:26px;padding-top:26px;border-top:1px solid var(--line)}

/* ---------- producers ---------- */
.producers{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
  gap:44px 32px;padding:44px 0 84px;
}
.producer-tile{
  aspect-ratio:3/2;background:var(--tint);border-radius:var(--r);
  display:flex;align-items:center;justify-content:center;font-size:58px;
}
.producer h3{font-size:15.5px;font-weight:600;margin-top:16px;letter-spacing:-.012em}
.producer .loc{margin-top:5px}
.producer p{font-size:13.5px;line-height:1.6;color:var(--ink-2);margin-top:10px}
.producer-stats{
  display:flex;gap:18px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);
  font-size:12px;color:var(--ink-3);
}
.producer-stats b{color:var(--ink);font-weight:600}

/* ---------- cart ---------- */
.cart-wrap{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:clamp(28px,5vw,64px);padding:34px 0 84px;align-items:start}
.cart-line{
  display:grid;grid-template-columns:76px 1fr auto;gap:18px;align-items:center;
  padding:18px 0;border-bottom:1px solid var(--line);
}
.cart-line:first-child{border-top:1px solid var(--line)}
.cart-tile{
  aspect-ratio:1/1;background:var(--tint);border-radius:var(--r);
  display:flex;align-items:center;justify-content:center;font-size:32px;
}
.cart-name{font-size:14.5px;font-weight:600;letter-spacing:-.01em}
.cart-sub{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.qty{display:flex;align-items:center;gap:2px;border:1px solid var(--line-2);border-radius:var(--r)}
.qty button{width:32px;height:32px;font-size:15px;color:var(--ink-2);transition:color .15s}
.qty button:hover{color:var(--ink)}
.qty span{min-width:26px;text-align:center;font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums}
.summary{background:var(--tint);border-radius:var(--r);padding:26px}
.summary h3{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-bottom:18px}
.srow{display:flex;justify-content:space-between;gap:14px;font-size:14px;padding:7px 0;color:var(--ink-2)}
.srow span:last-child{font-variant-numeric:tabular-nums;color:var(--ink)}
.srow.free span:last-child{color:var(--accent);font-weight:600}
.srow.total{
  margin-top:12px;padding-top:16px;border-top:1px solid var(--line-2);
  font-size:17px;font-weight:600;color:var(--ink);
}
.summary .btn{margin-top:20px;padding:14px}
.summary-note{font-size:11.5px;line-height:1.55;color:var(--ink-3);margin-top:14px;text-align:center}
.empty{padding:76px 0;text-align:center;border-top:1px solid var(--line)}
.empty h3{font-size:18px;font-weight:600;margin-bottom:10px;letter-spacing:-.015em}
.empty p{font-size:14px;color:var(--ink-2);max-width:42ch;margin:0 auto 22px}
.empty .btn{width:auto;display:inline-block;padding:13px 34px}

/* ---------- page head (producers / cart) ---------- */
.page-head{padding:clamp(44px,6vw,72px) 0 0}
.page-head h1{font-size:clamp(26px,3.6vw,38px);font-weight:600;letter-spacing:-.026em;line-height:1.12;margin:14px 0 12px}
.page-head p{font-size:15px;color:var(--ink-2);max-width:56ch}

/* ---------- editorial pages ---------- */
.editorial{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:0 56px;padding:44px 0 84px;max-width:1180px;
}
.ed-block{padding:26px 0;border-top:1px solid var(--line)}
.ed-block h3{font-size:16px;font-weight:600;letter-spacing:-.015em;margin-bottom:9px}
.ed-block p{font-size:14.5px;line-height:1.68;color:var(--ink-2);max-width:54ch}
.blog-soon{
  padding:64px 0 96px;border-top:1px solid var(--line);margin-top:40px;
}
.blog-soon p{font-size:15px;color:var(--ink-2);max-width:52ch;line-height:1.7}

/* ---------- footer ---------- */
.site-footer{border-top:1px solid var(--line);background:var(--bg)}
.footer-inner{
  max-width:1520px;margin:0 auto;padding:56px var(--pad) 0;
  display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:36px;
}
.footer-col h4{font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-bottom:14px}
.footer-col p,.footer-col li{font-size:13.5px;color:var(--ink-2);line-height:1.7}
.footer-col ul{list-style:none}
.foot-link{font-size:13.5px;color:var(--ink-2);line-height:1.7;text-align:left;transition:color .15s}
.foot-link:hover{color:var(--ink)}
.footer-brand .wordmark{font-size:15px;margin-bottom:12px;display:block;color:var(--ink);justify-self:start}
.footer-bottom{
  max-width:1520px;margin:0 auto;padding:30px var(--pad) 34px;margin-top:40px;
  border-top:1px solid var(--line);
  display:flex;flex-wrap:wrap;gap:10px 26px;justify-content:space-between;
  font-size:11.5px;color:var(--ink-3);
}

/* ---------- toast ---------- */
.toast{
  position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(14px);
  background:var(--deep);color:#F2EFE9;border-radius:var(--r);
  padding:13px 22px;font-size:12.5px;font-weight:500;letter-spacing:.02em;
  opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;z-index:90;
  max-width:calc(100vw - 32px);text-align:center;
}

/* ============ filters ============ */
/* Each product's value(s) for a given facet group, as language-neutral keys. */
function valuesOf(p, group){
  if (group === 'origin') return [p.region.en];
  if (group === 'farm')   return [p.farm];
  return p.tastes;
}

/* Label shown for a key, in the current language. */
function labelOf(group, key){
  const t = T();
  if (group === 'origin'){
    const p = PRODUCTS.find(x => x.region.en === key);
    return p ? p.region[lang] : key;
  }
  if (group === 'farm') return key;
  return t.tastes[key] || key;
}

/* Options of a group, in the order they first appear in the catalogue. */
function optionsOf(group){
  const out = [];
  PRODUCTS.forEach(p => valuesOf(p, group).forEach(v => { if (!out.includes(v)) out.push(v); }));
  return out;
}

/* A product passes a group when nothing is picked there, or it matches one pick (OR). */
function matchesGroup(p, group){
  const sel = picked[group];
  if (!sel.size) return true;
  return valuesOf(p, group).some(v => sel.has(v));
}

/* Products passing every group except the one named — used for the option counts,
   so each number tells you what you'd get by ticking that box. */
function poolExcluding(group){
  return PRODUCTS.filter(p => FACET_GROUPS.every(g => g === group || matchesGroup(p, g)));
}

function activeCount(){
  return FACET_GROUPS.reduce((n, g) => n + picked[g].size, 0);
}

function clearFilters(){
  FACET_GROUPS.forEach(g => picked[g].clear());
  renderFilters(); renderGrid();
}

function togglePick(group, key){
  const sel = picked[group];
  sel.has(key) ? sel.delete(key) : sel.add(key);
  renderFilters(); renderGrid();
}

function renderFilters(){
  const t = T();
  const titles = { origin:t.fOrigin, taste:t.fTaste, farm:t.fFarm };

  setText('t-facets-title', t.filtersTitle);
  setText('t-facet-bar', t.filtersTitle);
  setText('facets-clear', t.filtersClear);
  setText('facets-done', t.filtersApply);
  setText('empty-clear', t.noResultsCta);
  setText('t-no-results', t.noResults);

  const n = activeCount();
  el('facets-clear').hidden = n === 0;

  const toggle = el('rail-toggle');
  toggle.setAttribute('aria-expanded', String(railOpen));
  toggle.setAttribute('aria-label', railOpen ? t.filtersHide : t.filtersShow);
  toggle.title = railOpen ? t.filtersHide : t.filtersShow;
  el('rail-dot').hidden = railOpen || n === 0;
  const bar = el('facet-bar-n');
  bar.hidden = n === 0;
  bar.textContent = n;

  /* facet groups */
  const list = el('facet-list');
  list.innerHTML = '';
  FACET_GROUPS.forEach(group => {
    const counts = {};
    poolExcluding(group).forEach(p => valuesOf(p, group).forEach(v => counts[v] = (counts[v] || 0) + 1));

    const wrap = document.createElement('section');
    wrap.className = 'facet' + (openFacets.has(group) ? '' : ' closed');

    const head = document.createElement('button');
    head.className = 'facet-head';
    head.setAttribute('aria-expanded', String(openFacets.has(group)));
    head.innerHTML = `<span>${titles[group]}</span>
      <svg class="chev" viewBox="0 0 10 10" fill="none" aria-hidden="true">
        <path d="M1 3.5 5 7l4-3.5" stroke="currentColor" stroke-width="1.4"
              stroke-linecap="round" stroke-linejoin="round"/></svg>`;
    head.onclick = () => {
      openFacets.has(group) ? openFacets.delete(group) : openFacets.add(group);
      renderFilters();
    };
    wrap.appendChild(head);

    const body = document.createElement('div');
    body.className = 'facet-body';
    optionsOf(group).forEach(key => {
      const count = counts[key] || 0;
      const on = picked[group].has(key);
      const row = document.createElement('label');
      row.className = 'opt' + (count === 0 && !on ? ' off' : '');

      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = on;
      cb.disabled = count === 0 && !on;
      cb.onchange = () => togglePick(group, key);

      const box = document.createElement('span');
      box.className = 'box';
      const txt = document.createElement('span');
      txt.textContent = labelOf(group, key);
      const num = document.createElement('span');
      num.className = 'n';
      num.textContent = count;

      row.append(cb, box, txt, num);
      body.appendChild(row);
    });
    wrap.appendChild(body);
    list.appendChild(wrap);
  });

  /* active-filter chips */
  const chips = el('chips');
  chips.innerHTML = '';
  FACET_GROUPS.forEach(group => {
    picked[group].forEach(key => {
      const c = document.createElement('button');
      c.className = 'chip';
      c.innerHTML = `<span></span><span class="x" aria-hidden="true">&times;</span>`;
      c.firstChild.textContent = labelOf(group, key);
      c.setAttribute('aria-label', `${t.filtersClear}: ${labelOf(group, key)}`);
      c.onclick = () => togglePick(group, key);
      chips.appendChild(c);
    });
  });
  if (n){
    const clear = document.createElement('button');
    clear.className = 'chips-clear';
    clear.textContent = t.filtersClear;
    clear.onclick = clearFilters;
    chips.appendChild(clear);
  }
}

/* ============ product grid ============ */
function visibleProducts(){
  return PRODUCTS.filter(p => FACET_GROUPS.every(g => matchesGroup(p, g)));
}

function renderGrid(){
  const t = T();
  const list = visibleProducts();
  setText('t-grid-count', list.length + ' ' + (list.length === 1 ? t.countOne : t.countMany));

  el('empty-state').hidden = list.length > 0;
  el('grid').hidden = list.length === 0;

  const box = el('grid');
  box.innerHTML = '';
  list.forEach(p => {
    const card = document.createElement('article');
    card.className = 'card';
    card.innerHTML = `
      <div class="tile">${p.emoji}</div>
      <span class="u-label card-region">${p.region[lang]}</span>
      <h3 class="card-name">${p.name[lang]}</h3>
      <p class="card-farm">${p.farm}</p>
      <div class="card-foot">
        <span class="card-price">${money(p.price)}</span>
        <span class="card-unit">${p.unit[lang]}</span>
      </div>
      <button class="btn" data-id="${p.id}">${t.add}</button>`;
    card.onclick = () => openDetail(p.id);
    box.appendChild(card);
  });

  box.querySelectorAll('.btn').forEach(b => {
    b.onclick = e => {
      e.stopPropagation();
      addToCart(+b.dataset.id);
      flashAdded(b);
    };
  });
}

function flashAdded(btn){
  const t = T();
  btn.textContent = t.added;
  btn.classList.add('added');
  setTimeout(() => { btn.textContent = T().add; btn.classList.remove('added'); }, 1300);
}

  else showView('shop');

function renderDetail(id){
  const p = PRODUCTS.find(x => x.id === id);
  if (!p) return;
  currentDetailId = id;
  const t = T();

  el('d-tile').textContent = p.emoji;
  setText('d-region', p.region[lang]);
  setText('d-name', p.name[lang]);
  setText('d-farm', p.farm);
  el('d-price').innerHTML = `${money(p.price)}<span>${p.unit[lang]}</span>`;

  const add = el('d-add');
  add.textContent = t.add;
  add.classList.remove('added');
  add.onclick = () => { addToCart(p.id); flashAdded(add); };

  el('d-specs').innerHTML = [
    [t.charColor, p.color[lang]],
    [t.charHarvest, p.harvest[lang]],
    [t.charCrystal, p.crystal[lang]],
    [t.charFlavor, p.flavor[lang]],
  ].map(([k, v]) => `<div class="spec"><dt class="u-label">${k}</dt><dd>${v}</dd></div>`).join('');

  el('d-about').innerHTML = `<h3>${t.aboutTitle}</h3><p>${p.desc[lang]}</p>`;
  el('d-pairing').innerHTML = `<h3>${t.pairingTitle}</h3><p>${p.pairing[lang]}</p>`;
}

/* ============ cart ============ */
function addToCart(id){
  cart[id] = (cart[id] || 0) + 1;
  updateCount();
  showToast(T().toastAdd);
}

function chQty(id, d){
  cart[id] += d;
  if (cart[id] <= 0) delete cart[id];
  updateCount();
  renderCart();
}

function updateCount(){
  const n = Object.values(cart).reduce((a, b) => a + b, 0);
  const c = el('cart-count');
  c.textContent = n;
  c.hidden = n === 0;
}

function renderCart(){
  const t = T();
  const ids = Object.keys(cart);
  const box = el('cart-body');

  if (!ids.length){
    box.innerHTML = `
      <div class="empty">
        <h3>${t.emptyTitle}</h3>
        <p>${t.emptyText}</p>
        <button class="btn btn-outline" data-nav="shop">${t.emptyCta}</button>
      </div>`;
    bindNav(box);
    return;
  }

  let subtotal = 0;
  const lines = ids.map(id => {
    const p = PRODUCTS.find(x => x.id == id);
    const q = cart[id];
    subtotal += p.price * q;
    return `
      <div class="cart-line">
        <div class="cart-tile">${p.emoji}</div>
        <div>
          <div class="cart-name">${p.name[lang]}</div>
          <div class="cart-sub">${p.farm} · ${money(p.price)}</div>
        </div>
        <div class="qty">
          <button onclick="chQty(${id},-1)" aria-label="−">−</button>
          <span>${q}</span>
          <button onclick="chQty(${id},1)" aria-label="+">+</button>
        </div>
      </div>`;
  }).join('');

  box.innerHTML = `
    <div class="cart-wrap">
      <div>${lines}</div>
      <aside class="summary">
        <h3>${t.summaryTitle}</h3>
        <div class="srow"><span>${t.subtotal}</span><span>${money(subtotal)}</span></div>
        <div class="srow free"><span>${t.shipping}</span><span>${t.shipIncluded}</span></div>
        <div class="srow total"><span>${t.total}</span><span>${money(subtotal)}</span></div>
        <button class="btn btn-solid" onclick="startCheckout()">${t.checkout}</button>
        <p class="summary-note">${t.summaryNote}</p>
      </aside>
    </div>`;
}

/* ============ toast ============ */
let toastTimer;
function showToast(msg){
  const n = el('toast');
  n.textContent = msg;
  n.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => n.classList.remove('show'), 1600);
}

/* ============ checkout — Stripe Checkout Session via server/ ============ */
const CHECKOUT_API = 'https://urbanbees-checkout.onrender.com/api/checkout';

async function startCheckout(){
  const btn = document.querySelector('.summary .btn');
  if (btn) { btn.disabled = true; btn.textContent = T().checkoutLoading; }
  try {
    const res = await fetch(CHECKOUT_API, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({cart, lang}),
    });
    if (!res.ok) throw new Error('checkout request failed');
    const {url} = await res.json();
    if (!url) throw new Error('no checkout url returned');
    window.location.href = url;
  } catch (err) {
    console.error(err);
    showToast(T().checkoutError);
    if (btn) { btn.disabled = false; btn.textContent = T().checkout; }
  }
}

function handleCheckoutRedirect(){
  const params = new URLSearchParams(location.search);
  if (params.has('success')) {
    cart = {};
    updateCount();
    showToast(T().checkoutSuccess);
  }
  if (params.has('success') || params.has('canceled')) {
    history.replaceState('', document.title, location.pathname + location.hash);
  }
}

/* ============ navigation ============ */
function showView(name){
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  el('view-' + name).classList.add('active');
  const aboutViews = ['producers', 'why', 'promise'];
  document.querySelectorAll('.nav-left [data-nav]').forEach(b =>
    b.classList.toggle('on', b.dataset.nav === name));
  el('about-trigger').classList.toggle('on', aboutViews.includes(name));
  closeMenus();
  if (name === 'cart') renderCart();
  window.scrollTo(0, 0);
}

function bindNav(scope){
  scope.querySelectorAll('[data-nav]').forEach(b => {
    b.onclick = () => {
      if (location.hash) history.pushState('', document.title, location.pathname + location.search);
      showView(b.dataset.nav);
    };
  });
}

function routeHash(){
  const h = location.hash;
  if (h.startsWith('#honey-')){
    const id = +h.slice(7);
    if (PRODUCTS.some(p => p.id === id)){
      renderDetail(id);
      showView('detail');
      return;
    }
  }
  if (el('view-detail').classList.contains('active')) showView('shop');
}
window.addEventListener('hashchange', routeHash);

/* ============ menus ============ */
const aboutMenu = el('about-menu');
const mobileNav = el('mobile-nav');
const menuBtn = el('menu-btn');

function closeMenus(){
  aboutMenu.classList.remove('open');
  el('about-trigger').setAttribute('aria-expanded', 'false');
  mobileNav.classList.remove('open');
  menuBtn.setAttribute('aria-expanded', 'false');
}

el('about-trigger').onclick = e => {
  e.stopPropagation();
  const open = aboutMenu.classList.toggle('open');
  el('about-trigger').setAttribute('aria-expanded', String(open));
};

menuBtn.onclick = e => {
  e.stopPropagation();
  const open = mobileNav.classList.toggle('open');
  menuBtn.setAttribute('aria-expanded', String(open));
};

document.addEventListener('click', closeMenus);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeMenus(); });

/* ============ filter drawer (mobile) ============ */
const facetBar = el('facet-bar');
const facetsBox = el('facets');

function toggleFacets(open){
  facetsBox.classList.toggle('open', open);
  facetBar.setAttribute('aria-expanded', String(open));
  el('facets-done').hidden = !open;
}

facetBar.onclick = () => toggleFacets(!facetsBox.classList.contains('open'));

el('rail-toggle').onclick = () => {
  railOpen = !railOpen;
  document.querySelector('.shop-layout').classList.toggle('rail-closed', !railOpen);
  renderFilters();
};
el('facets-done').onclick = () => {
  toggleFacets(false);
  el('facet-bar').scrollIntoView({ block:'start' });
};
el('facets-clear').onclick = clearFilters;
el('empty-clear').onclick = () => { clearFilters(); toggleFacets(false); };

/* ============ boot ============ */
bindNav(document);
setLang(lang);
routeHash();
handleCheckoutRedirect();
</script>
</body>
</html>
