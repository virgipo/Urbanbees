<style>
:root{
  /* Erewhon's system, Urban Bees' hue */
  --bg:#FCFBF9;
  --surface:#FFFFFF;
  --tint:#F1EADF;
  --tint-deep:#E7DCCB;
  --ink:#212121;
  --ink-2:#6E6A64;
  --ink-3:#9A958D;
  --line:#E4E0D9;
  --line-2:#CFC9BF;
  --btn:#E8E7E3;
  --btn-hover:#DEDCD6;
  --accent:#A8681B;
  --deep:#1F2A1E;

  --font:'Plus Jakarta Sans','Helvetica Neue',Helvetica,Arial,sans-serif;
  --r:3px;
  --u:4px;
  --pad:clamp(20px,5vw,64px);
}

*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--ink);
  font-size:16px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  letter-spacing:-.005em;
}
img{max-width:100%}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:inherit;text-decoration:none}

.u-label{
  font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-3);
}

/* ---------- header: one dark bar, three zones ---------- */
.site-header{
  position:sticky;top:0;z-index:70;
  background:var(--deep);color:#F2EFE9;
}
.header-inner{
  max-width:1520px;margin:0 auto;padding:0 var(--pad);
  height:80px;display:grid;grid-template-columns:1fr auto 1fr;
  align-items:center;gap:20px;
}
.nav-left{display:flex;align-items:center;gap:30px}
.nav-right{justify-self:end;display:flex;align-items:center;gap:22px}
.wordmark{
  justify-self:center;color:#FFFFFF;
  font-size:19px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;
  white-space:nowrap;
}
.navlink{
  display:inline-flex;align-items:center;gap:6px;
  font-size:11.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;
  color:rgba(242,239,233,.74);padding:4px 0;
  border-bottom:1px solid transparent;transition:color .15s,border-color .15s;
}
.navlink:hover,.navlink.on{color:#FFFFFF}
.navlink.on{border-bottom-color:rgba(255,255,255,.65)}
.navlink svg{width:9px;height:9px;flex:none;transition:transform .18s}

/* dropdown */
.has-menu{position:relative}
.has-menu:hover .navlink svg,.has-menu.open .navlink svg{transform:rotate(180deg)}
.dropdown{
  position:absolute;top:100%;left:-18px;min-width:228px;
  background:var(--deep);border:1px solid rgba(255,255,255,.14);border-top:none;
  border-radius:0 0 var(--r) var(--r);
  padding:8px 0;opacity:0;visibility:hidden;transform:translateY(-4px);
  transition:opacity .16s,transform .16s,visibility .16s;
}
.has-menu:hover .dropdown,
.has-menu:focus-within .dropdown,
.has-menu.open .dropdown{opacity:1;visibility:visible;transform:translateY(0)}
.dropdown button{
  display:block;width:100%;text-align:left;padding:11px 20px;
  font-size:12px;font-weight:500;letter-spacing:.04em;
  color:rgba(242,239,233,.78);transition:color .14s,background .14s;
}
.dropdown button:hover{color:#FFFFFF;background:rgba(255,255,255,.07)}

/* language: the name of the language you are reading, and a way to change it */
.lang-menu .dropdown{left:auto;right:-14px;min-width:150px}
.lang-menu .dropdown button.on{color:#FFFFFF;background:rgba(255,255,255,.07)}
.lang-menu .dropdown button.on::before{content:'·';margin-right:7px;color:var(--tint)}
.lang-menu .dropdown button:not(.on)::before{content:'';margin-right:12px}
.cart-btn{
  font-size:11.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;
  display:flex;align-items:center;gap:8px;color:rgba(242,239,233,.86);transition:color .15s;
}
.cart-btn:hover{color:#FFFFFF}
.cart-count{
  min-width:19px;height:19px;padding:0 5px;border-radius:100px;
  background:#FFFFFF;color:var(--deep);
  font-size:10.5px;font-weight:700;letter-spacing:0;
  display:flex;align-items:center;justify-content:center;
}
.cart-count[hidden]{display:none}

/* mobile menu */
.menu-btn{display:none;font-size:11.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:rgba(242,239,233,.86)}
.mobile-nav{display:none;border-top:1px solid rgba(255,255,255,.14);padding:6px 0 14px}
.mobile-nav.open{display:block}
.mobile-nav button{
  display:block;width:100%;text-align:left;
  padding:12px var(--pad);font-size:12.5px;font-weight:600;
  letter-spacing:.1em;text-transform:uppercase;color:rgba(242,239,233,.8);
}
.mobile-nav .m-group{
  display:block;padding:14px var(--pad) 2px;
  font-size:11px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;
  color:rgba(242,239,233,.42);
}
.mobile-nav button.sub{
  text-transform:none;letter-spacing:.03em;font-weight:500;
  padding-left:calc(var(--pad) + 18px);color:rgba(242,239,233,.62);font-size:13px;
}

/* ---------- views ---------- */
.view{display:none}
.view.active{display:block}
.shell{max-width:1520px;margin:0 auto;padding:0 var(--pad)}

/* ---------- announcement bar ---------- */
/* One message at a time, held still so it can be read, with arrows to step
   through the rest. It advances on its own slowly and stops the moment the
   reader's pointer or keyboard lands on it. */
.announce{
  background:var(--tint);color:var(--deep);
  border-bottom:1px solid rgba(31,42,30,.10);
}
.announce-inner{
  max-width:1520px;margin:0 auto;padding:0 10px;
  display:grid;grid-template-columns:38px 1fr 38px;align-items:center;min-height:42px;
}
.announce-slot{
  position:relative;overflow:hidden;text-align:center;
  display:flex;align-items:center;justify-content:center;min-height:42px;
}
.announce-msg{
  font-size:12px;font-weight:600;letter-spacing:.075em;
  padding:4px 2px;line-height:1.35;color:var(--deep);
  display:inline-flex;align-items:center;gap:9px;
  transition:opacity .34s ease,transform .34s ease;
}
.announce-msg .arr{
  width:13px;height:13px;flex:none;
  transition:transform .18s ease;
}
.announce-slot:hover .announce-msg .arr{transform:translateX(3px)}
/* With a single message there is nothing to step through, so the arrows go. */
.announce.single .announce-inner{grid-template-columns:1fr}
.announce.single .announce-arrow{display:none}
.announce-msg.out{opacity:0;transform:translateY(-5px)}
.announce-arrow{
  width:34px;height:34px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  color:var(--deep);opacity:.55;transition:opacity .15s,background .15s;
}
.announce-arrow:hover{opacity:1;background:rgba(31,42,30,.10)}
.announce-arrow svg{width:13px;height:13px}
@media (prefers-reduced-motion:reduce){
  .announce-msg{transition:none}
}
@media (max-width:620px){
  .announce-inner{grid-template-columns:32px 1fr 32px;padding:0 4px}
  .announce-msg{font-size:11px;letter-spacing:.05em}
  .announce-arrow{width:30px;height:30px}
}

/* ---------- hero ---------- */
.hero{
  position:relative;isolation:isolate;text-align:center;
  padding:clamp(76px,11vw,140px) var(--pad) clamp(58px,8vw,100px);
  background-color:#26311F;
  background-image:url("hero-apiary.jpg");
  background-size:cover;
  background-position:center 64%;
}
/* Scrim: the type sits on a photograph, so contrast is guaranteed here
   rather than hoped for. It also softens the image's low resolution. */
.hero::before{
  content:'';position:absolute;inset:0;z-index:-1;
  background:linear-gradient(180deg,
    rgba(16,24,14,.72) 0%,
    rgba(16,24,14,.62) 44%,
    rgba(16,24,14,.80) 100%);
}
.hero-inner{max-width:900px;margin:0 auto}
.hero .u-label{display:block;margin-bottom:20px;color:rgba(255,255,255,.8)}
.hero h1{
  font-size:clamp(32px,4.8vw,52px);
  font-weight:600;line-height:1.08;letter-spacing:-.028em;
  max-width:18ch;margin:0 auto 20px;text-wrap:balance;
  color:#FFFFFF;text-shadow:0 1px 20px rgba(0,0,0,.4);
}
.hero p{
  font-size:16px;line-height:1.6;max-width:54ch;margin:0 auto;
  color:rgba(255,255,255,.9);text-shadow:0 1px 14px rgba(0,0,0,.42);
}

/* ---------- shop layout: sidebar + grid ---------- */
.shop-layout{
  display:grid;grid-template-columns:232px minmax(0,1fr);
  gap:0 56px;align-items:start;padding-top:40px;
}
.facet-bar{display:none}
.shop-layout.rail-closed{grid-template-columns:38px minmax(0,1fr);gap:0 26px}
.shop-layout.rail-closed .facets-body{display:none}
.shop-layout.rail-closed .facets-head h2,
.shop-layout.rail-closed .facets-clear{display:none}
.shop-layout.rail-closed .facets-head{padding-bottom:0;border-bottom:0}
.shop-layout.rail-closed .rail-toggle .chev{transform:rotate(180deg)}
.shop-layout.rail-closed .rail-toggle{
  width:32px;height:32px;margin-left:0;
  border:1px solid var(--line-2);background:var(--bg);color:var(--ink-2);
}
.shop-layout.rail-closed .rail-toggle:hover{background:var(--tint);color:var(--ink);border-color:var(--ink-3)}

.rail-toggle{
  width:26px;height:26px;margin-left:-5px;flex:none;position:relative;
  display:inline-flex;align-items:center;justify-content:center;
  border-radius:50%;color:var(--ink-3);
  transition:background .15s,color .15s;
}
.rail-toggle:hover{background:var(--tint);color:var(--ink)}
.rail-toggle .chev{width:11px;height:11px;transition:transform .22s}
.rail-dot{
  position:absolute;top:1px;right:1px;width:6px;height:6px;border-radius:50%;
  background:var(--accent);
}
.rail-dot[hidden]{display:none}

.facets{position:sticky;top:104px;padding-bottom:60px}
.facets-head{
  display:flex;align-items:center;gap:9px;
  padding-bottom:6px;
}
.facets-head h2{margin-right:auto}
.facets-head h2{
  font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);
}
.facets-clear{
  font-size:11.5px;color:var(--ink-3);text-decoration:underline;
  text-underline-offset:3px;transition:color .15s;
}
.facets-clear:hover{color:var(--ink)}
.facets-clear[hidden]{display:none}

.facet{border-top:1px solid var(--line)}
.facet-head{
  width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:16px 0 14px;text-align:left;
  font-size:12.5px;font-weight:600;letter-spacing:.01em;color:var(--ink);
}
.facet-head .chev{width:9px;height:9px;flex:none;transition:transform .2s;color:var(--ink-3)}
.facet.closed .chev{transform:rotate(-90deg)}
.facet-body{display:flex;flex-direction:column;gap:2px;padding-bottom:16px}
.facet.closed .facet-body{display:none}

.opt{
  display:flex;align-items:center;gap:10px;cursor:pointer;
  padding:5px 0;font-size:13.5px;color:var(--ink-2);line-height:1.45;
  transition:color .15s;
}
.opt:hover{color:var(--ink)}
.opt input{position:absolute;opacity:0;width:0;height:0}
.opt .box{
  width:15px;height:15px;flex:none;border:1px solid var(--line-2);border-radius:2px;
  background:transparent;position:relative;transition:background .15s,border-color .15s;
}
.opt .box::after{
  content:'';position:absolute;left:4px;top:.5px;width:4px;height:8px;
  border:solid #FFF;border-width:0 1.6px 1.6px 0;transform:rotate(43deg) scale(0);
  transition:transform .15s;
}
.opt input:checked + .box{background:var(--deep);border-color:var(--deep)}
.opt input:checked + .box::after{transform:rotate(43deg) scale(1)}
.opt input:focus-visible + .box{outline:2px solid var(--accent);outline-offset:2px}
.opt .n{margin-left:auto;font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.opt.off{opacity:.38;cursor:not-allowed}
.opt.off:hover{color:var(--ink-2)}

.chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 0 4px}
.chips:empty{display:none}
.chip{
  display:inline-flex;align-items:center;gap:7px;
  padding:5px 10px;border:1px solid var(--line-2);border-radius:100px;
  font-size:12px;color:var(--ink-2);transition:border-color .15s,color .15s;
}
.chip:hover{border-color:var(--ink-2);color:var(--ink)}
.chip .x{font-size:13px;line-height:1;color:var(--ink-3)}
.chips-clear{
  align-self:center;margin-left:4px;padding:5px 2px;
  font-size:12px;color:var(--ink-3);text-decoration:underline;text-underline-offset:3px;
  transition:color .15s;
}
.chips-clear:hover{color:var(--ink)}

.empty-state{padding:56px 0 90px;max-width:420px}
.empty-state p{font-size:14.5px;color:var(--ink-2);margin-bottom:16px}

/* ---------- product grid ---------- */
.grid-head{
  display:flex;align-items:baseline;justify-content:space-between;gap:16px;
  padding:18px 0 22px;
}
.grid-head h2{font-size:16px;font-weight:600;letter-spacing:-.01em}
.grid-head span{font-size:12px;color:var(--ink-3)}
.grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));
  gap:40px 24px;padding-bottom:84px;
}
.grid[hidden]{display:none}
.empty-state[hidden]{display:none}
.card{display:flex;flex-direction:column;cursor:pointer}
.card.sold-out .tile{opacity:.5}
.card.sold-out .card-name,.card.sold-out .card-price{color:var(--ink-3)}
.card .tile{position:relative}
.stock-flag{
  position:absolute;left:10px;top:10px;
  font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  padding:4px 8px;border-radius:2px;line-height:1;
}
.stock-flag.out{background:var(--ink);color:var(--bg)}
.stock-flag.low{background:var(--accent);color:#FFF8EC}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:disabled:hover{background:var(--btn)}
.tile{
  aspect-ratio:1/1;background:var(--tint);border-radius:var(--r);
  display:flex;align-items:center;justify-content:center;
  font-size:64px;line-height:1;
  transition:background .2s;
}
.card:hover .tile{background:var(--tint-deep)}
.card-region{margin-top:14px}
.card-name{
  font-size:15px;font-weight:600;line-height:1.3;margin-top:7px;letter-spacing:-.012em;
}
.card-farm{font-size:12.5px;color:var(--ink-3);margin-top:3px}
.card-foot{
  display:flex;align-items:baseline;gap:7px;margin-top:10px;
}
.card-price{font-size:14.5px;font-weight:600;font-variant-numeric:tabular-nums}
.card-unit{font-size:12px;color:var(--ink-3)}
.btn{
  width:100%;margin-top:14px;
  background:var(--btn);color:var(--ink);
  border-radius:var(--r);padding:11px 14px;
  font-size:11px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;
  transition:background .15s;
}
.btn:hover{background:var(--btn-hover)}
.btn.added{background:var(--deep);color:#F2EFE9}
.btn-outline{
  background:transparent;border:1px solid var(--ink);
}
.btn-outline:hover{background:var(--btn)}
.btn-solid{background:var(--deep);color:#F2EFE9}
.btn-solid:hover{background:#2A3829}
.btn:disabled{opacity:.5;cursor:default}

/* ---------- detail ---------- */
.back{
  display:inline-flex;align-items:center;gap:9px;padding:26px 0 0;
  font-size:11.5px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;
  color:var(--ink-2);
}
.back:hover{color:var(--ink)}
.detail{
  display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  gap:clamp(28px,5vw,72px);padding:34px 0 80px;align-items:start;
}
.detail-tile{
  aspect-ratio:1/1;background:var(--tint);border-radius:var(--r);
  display:flex;align-items:center;justify-content:center;font-size:clamp(90px,14vw,160px);
}
.detail-info h1{
  font-size:clamp(26px,3.4vw,36px);font-weight:600;line-height:1.12;
  letter-spacing:-.026em;margin:12px 0 10px;text-wrap:balance;
}
.detail-farm{font-size:14px;color:var(--ink-2)}
.detail-buy{
  display:flex;align-items:center;gap:20px;flex-wrap:wrap;
  margin:26px 0;padding:22px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
}
.detail-price{font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.detail-price span{display:block;font-size:12px;font-weight:400;color:var(--ink-3);letter-spacing:0;margin-top:2px}
.detail-buy .btn{width:auto;margin:0;min-width:190px;padding:13px 26px}
.specs{display:grid;grid-template-columns:repeat(2,1fr);gap:0}
.spec{padding:16px 0;border-bottom:1px solid var(--line)}
.spec:nth-child(odd){padding-right:18px}
.spec dt{margin-bottom:5px}
.spec dd{font-size:13.5px;font-weight:500;line-height:1.4}
.prose{padding:26px 0 0}
.prose h3{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-bottom:10px}
.prose p{font-size:14.5px;line-height:1.65;color:var(--ink-2);max-width:60ch}
.prose + .prose{margin-top:26px;padding-top:26px;border-top:1px solid var(--line)}

/* ---------- producers ---------- */
.producers{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
  gap:44px 32px;padding:44px 0 84px;
}
.producer-tile{
  aspect-ratio:3/2;background:var(--tint);border-radius:var(--r);
  display:flex;align-items:center;justify-content:center;font-size:58px;
}
.producer h3{font-size:15.5px;font-weight:600;margin-top:16px;letter-spacing:-.012em}
.producer .loc{margin-top:5px}
.producer p{font-size:13.5px;line-height:1.6;color:var(--ink-2);margin-top:10px}
.producer-stats{
  display:flex;gap:18px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);
  font-size:12px;color:var(--ink-3);
}
.producer-stats b{color:var(--ink);font-weight:600}

/* ---------- cart ---------- */
.cart-wrap{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:clamp(28px,5vw,64px);padding:34px 0 84px;align-items:start}
.cart-line{
  display:grid;grid-template-columns:76px 1fr auto;gap:18px;align-items:center;
  padding:18px 0;border-bottom:1px solid var(--line);
}
.cart-line:first-child{border-top:1px solid var(--line)}
.cart-tile{
  aspect-ratio:1/1;background:var(--tint);border-radius:var(--r);
  display:flex;align-items:center;justify-content:center;font-size:32px;
}
.cart-name{font-size:14.5px;font-weight:600;letter-spacing:-.01em}
.cart-sub{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.qty{display:flex;align-items:center;gap:2px;border:1px solid var(--line-2);border-radius:var(--r)}
.qty button{width:32px;height:32px;font-size:15px;color:var(--ink-2);transition:color .15s}
.qty button:hover{color:var(--ink)}
.qty span{min-width:26px;text-align:center;font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums}
.summary{background:var(--tint);border-radius:var(--r);padding:26px}
.summary h3{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-bottom:18px}
.srow{display:flex;justify-content:space-between;gap:14px;font-size:14px;padding:7px 0;color:var(--ink-2)}
.srow span:last-child{font-variant-numeric:tabular-nums;color:var(--ink)}
.srow.free span:last-child{color:var(--accent);font-weight:600}
.srow.total{
  margin-top:12px;padding-top:16px;border-top:1px solid var(--line-2);
  font-size:17px;font-weight:600;color:var(--ink);
}
.summary .btn{margin-top:20px;padding:14px}
.summary-note{font-size:11.5px;line-height:1.55;color:var(--ink-3);margin-top:14px;text-align:center}
.summary .pay-alt{margin-top:10px}
.summary .pay-alt[hidden]{display:none}

/* bank-transfer form */
.tform{max-width:620px}
.tform .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.tform .grid .wide{grid-column:1/-1}
@media (max-width:560px){.tform .grid{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:11.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.field input,.field textarea{
  font-family:var(--font);font-size:15px;color:var(--ink);background:var(--surface);
  border:1px solid var(--line-2);border-radius:var(--r);padding:11px 13px;width:100%;
}
.field input:focus,.field textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.field textarea{resize:vertical;min-height:84px}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.tform .btn{margin-top:4px}
.form-privacy{font-size:12.5px;line-height:1.6;color:var(--ink-3);margin:18px 0 4px;max-width:58ch}
.form-privacy a{color:var(--ink-2)}
.form-err{color:#9C2B26;font-size:14px;margin-top:12px}
.form-err[hidden]{display:none}

/* bank details, after the order is placed */
.bank{background:var(--tint);border-radius:var(--r);padding:24px;margin:22px 0}
.bank dl{display:grid;grid-template-columns:auto 1fr;gap:12px 22px;margin:0}
.bank dt{font-size:11.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);align-self:center}
.bank dd{margin:0;font-size:16px}
.bank .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:15px;letter-spacing:.02em}
.bank .ref{font-weight:700;font-size:19px}
.empty{padding:76px 0;text-align:center;border-top:1px solid var(--line)}
.empty h3{font-size:18px;font-weight:600;margin-bottom:10px;letter-spacing:-.015em}
.empty p{font-size:14px;color:var(--ink-2);max-width:42ch;margin:0 auto 22px}
.empty .btn{width:auto;display:inline-block;padding:13px 34px}

/* ---------- page head (producers / cart) ---------- */
.page-head{padding:clamp(44px,6vw,72px) 0 0}
.page-head h1{font-size:clamp(26px,3.6vw,38px);font-weight:600;letter-spacing:-.026em;line-height:1.12;margin:14px 0 12px}
.page-head p{font-size:15px;color:var(--ink-2);max-width:56ch}

/* ---------- editorial pages ---------- */
.editorial{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:0 56px;padding:44px 0 84px;max-width:1180px;
}
/* A plain stacked heading: the editorial grid would spread these into columns. */
.page-head{padding:44px 0 30px;max-width:620px}
.page-head h1{font-size:clamp(26px,3.6vw,36px);font-weight:600;letter-spacing:-.025em;line-height:1.12;margin:14px 0 12px}
.page-head p{font-size:15.5px;line-height:1.62;color:var(--ink-2)}
.tform{padding-bottom:84px}

/* contact pages */
.contact-grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:0 56px;padding-bottom:90px;max-width:1000px;
}
.ct-block{padding:26px 0;border-top:1px solid var(--line)}
.ct-block h3{font-size:16px;font-weight:600;letter-spacing:-.015em;margin-bottom:9px}
.ct-block p{font-size:14.5px;line-height:1.68;color:var(--ink-2);max-width:50ch}
.ct-block a{color:var(--accent);text-decoration:none}
.ct-block a:hover{text-decoration:underline}
.ct-big{font-size:19px;font-weight:600;letter-spacing:-.01em;display:inline-block;margin-top:4px}

.ed-block{padding:26px 0;border-top:1px solid var(--line)}
.ed-block h3{font-size:16px;font-weight:600;letter-spacing:-.015em;margin-bottom:9px}
.ed-block p{font-size:14.5px;line-height:1.68;color:var(--ink-2);max-width:54ch}
.blog-soon{
  padding:64px 0 96px;border-top:1px solid var(--line);margin-top:40px;
}
.blog-soon p{font-size:15px;color:var(--ink-2);max-width:52ch;line-height:1.7}

/* ---------- newsletter ---------- */
.news{border-top:1px solid var(--line);background:var(--tint)}
.news-inner{
  max-width:1520px;margin:0 auto;padding:46px var(--pad) 48px;
  display:grid;grid-template-columns:minmax(0,1fr) minmax(0,440px);
  gap:22px 56px;align-items:start;
}
.news-inner h3{font-size:20px;font-weight:600;letter-spacing:-.018em;margin-bottom:8px}
.news-inner > div > p{font-size:14.5px;color:var(--ink-2);max-width:46ch;line-height:1.6}
.news-form{display:flex;gap:10px;flex-wrap:wrap}
.news-form input[type=email]{
  flex:1 1 220px;font-family:var(--font);font-size:15px;color:var(--ink);
  background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);padding:12px 14px;
}
.news-form input[type=email]:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.news-form .btn{flex:0 0 auto;width:auto;padding:12px 26px}
.news-note{grid-column:2;font-size:12px;line-height:1.55;color:var(--ink-3);margin:0}
.news-note a{color:var(--ink-2)}
.news-msg{grid-column:2;font-size:14px;color:var(--accent);margin:0;font-weight:600}
.news-msg[hidden]{display:none}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:860px){
  .news-inner{grid-template-columns:1fr;gap:18px}
  .news-note,.news-msg{grid-column:1}
}

/* ---------- footer ---------- */
.site-footer{border-top:1px solid var(--line);background:var(--bg)}
.footer-inner{
  max-width:1520px;margin:0 auto;padding:56px var(--pad) 0;
  display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:36px;
}
.footer-col h4{font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-bottom:14px}
.footer-col p,.footer-col li{font-size:13.5px;color:var(--ink-2);line-height:1.7}
.footer-col ul{list-style:none}
.foot-link{font-size:13.5px;color:var(--ink-2);line-height:1.7;text-align:left;text-decoration:none;transition:color .15s}
.foot-link:hover{color:var(--ink)}
.foot-social li{margin-bottom:4px}
.foot-link.with-icon{display:inline-flex;align-items:center;gap:9px}
.foot-link .ico{
  width:17px;height:17px;flex:none;color:var(--ink-3);transition:color .15s;
}
.foot-link.with-icon:hover .ico{color:var(--accent)}
.footer-brand .wordmark{font-size:15px;margin-bottom:12px;display:block;color:var(--ink);justify-self:start}
.footer-bottom{
  max-width:1520px;margin:0 auto;padding:30px var(--pad) 34px;margin-top:40px;
  border-top:1px solid var(--line);
  display:flex;flex-wrap:wrap;gap:10px 26px;justify-content:space-between;
  font-size:11.5px;color:var(--ink-3);
}

/* ---------- toast ---------- */
.toast{
  position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(14px);
  background:var(--deep);color:#F2EFE9;border-radius:var(--r);
  padding:13px 22px;font-size:12.5px;font-weight:500;letter-spacing:.02em;
  opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;z-index:90;
  max-width:calc(100vw - 32px);text-align:center;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

@media (max-width:860px){
  .detail,.cart-wrap{grid-template-columns:1fr}
  .nav-left .navlink,.nav-left .has-menu{display:none}
  .menu-btn{display:inline-flex}
  .header-inner{height:62px;gap:10px}
  .shop-layout,.shop-layout.rail-closed{grid-template-columns:1fr;gap:0;padding-top:0}
  .shop-layout.rail-closed .facets-body,
  .shop-layout.rail-closed .facets-clear{display:block}
  .rail-toggle{display:none}
  .facet-bar{
    display:flex;align-items:center;gap:8px;width:100%;
    margin-top:30px;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
    font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);
  }
  .facet-bar-n{
    display:inline-flex;align-items:center;justify-content:center;min-width:17px;height:17px;
    padding:0 5px;border-radius:100px;background:var(--deep);color:#FFF;
    font-size:10.5px;letter-spacing:0;
  }
  .facet-bar-n[hidden]{display:none}
  .facets{display:none;position:static;padding:8px 0 20px}
  .facets-head h2{display:none}
  .facets-head{justify-content:flex-end;padding:10px 0 0}
  .facets.open{display:block}
  .facets-done{width:100%;margin-top:18px}
  .facets-done[hidden]{display:none}
  .chips{padding-top:18px}
  .wordmark{font-size:15px;letter-spacing:.18em}
  /* Narrow viewports fit the photo's full height, so 'cover' leaves nothing
     to pan. Zoom in instead, to the hives standing in the rape field. */
  .hero{background-size:auto 140%;background-position:center 78%}
}
@media (max-width:560px){
  .grid{grid-template-columns:repeat(2,1fr);gap:28px 14px}
  .tile{font-size:44px}
  .specs{grid-template-columns:1fr}
  .spec:nth-child(odd){padding-right:0}
  .cart-line{grid-template-columns:60px 1fr;row-gap:12px}
  .cart-line .qty{grid-column:2;justify-self:start}
  .wordmark{font-size:13.5px;letter-spacing:.1em}
  .nav-right{gap:14px}
  .header-inner{gap:8px;padding:0 16px}
}
</style>
</head>
<body>

<div class="announce">
  <div class="announce-inner">
    <button class="announce-arrow" id="ann-prev">
      <svg viewBox="0 0 10 10" fill="none" aria-hidden="true">
        <path d="M6.5 1 2.5 5l4 4" stroke="currentColor" stroke-width="1.5"
              stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="announce-slot" id="ann-link" aria-live="polite">
      <span class="announce-msg" id="ann-text"></span>
    </button>
    <button class="announce-arrow" id="ann-next">
      <svg viewBox="0 0 10 10" fill="none" aria-hidden="true">
        <path d="M3.5 1l4 4-4 4" stroke="currentColor" stroke-width="1.5"
              stroke-linecap="round" stroke-linejoin="round"/></svg>

</div>

<header class="site-header">
  <div class="header-inner">
    <div class="nav-left">
      <button class="menu-btn" id="menu-btn" aria-expanded="false" aria-controls="mobile-nav">
        <span id="t-menu"></span>
      </button>
      <button class="navlink" data-nav="shop" id="t-nav-shop"></button>

          <span id="t-nav-about"></span>
          <svg viewBox="0 0 10 10" fill="none" aria-hidden="true">
            <path d="M1 3.5 L5 7 L9 3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
        </button>
        <div class="dropdown" id="about-dropdown">
          <button data-nav="producers" id="t-menu-beekeepers"></button>
          <button data-nav="why" id="t-menu-why"></button>
          <button data-nav="promise" id="t-menu-promise"></button>
        </div>
      </div>

    <div class="nav-right">
      <div class="has-menu lang-menu" id="lang-menu">
        <button class="navlink" id="lang-trigger" aria-expanded="false" aria-haspopup="true">
          <span id="t-lang-current"></span>
          <svg viewBox="0 0 10 10" fill="none" aria-hidden="true">

        </button>
        <div class="dropdown" id="lang-dropdown">

      </button>
    </div>
  </div>

  <nav class="mobile-nav" id="mobile-nav">
    <button data-nav="shop" id="t-m-shop"></button>
    <span class="m-group" id="t-m-about"></span>
    <button data-nav="producers" class="sub" id="t-m-beekeepers"></button>
    <button data-nav="why" class="sub" id="t-m-why"></button>
    <button data-nav="promise" class="sub" id="t-m-promise"></button>
    <button data-nav="blog" id="t-m-blog"></button>
  </nav>
</header>

<main>

  <!-- ============ shop ============ -->
  <section class="view active" id="view-shop">
    <div class="hero">
      <div class="hero-inner">
        <span class="u-label" id="t-hero-label"></span>
        <h1 id="t-hero-title"></h1>
        <p id="t-hero-sub"></p>
      </div>
    </div>
    <div class="shell">
      <button class="facet-bar" id="facet-bar" aria-expanded="false" aria-controls="facets">
        <span id="t-facet-bar"></span>
        <span class="facet-bar-n" id="facet-bar-n" hidden>0</span>

      <div class="shop-layout">
        <aside class="facets" id="facets">
          <div class="facets-head">
            <button class="rail-toggle" id="rail-toggle" aria-expanded="true" aria-controls="facet-list">
              <svg class="chev" viewBox="0 0 10 10" fill="none" aria-hidden="true">
                <path d="M6.5 1 3 5l3.5 4" stroke="currentColor" stroke-width="1.5"
                      stroke-linecap="round" stroke-linejoin="round"/></svg>
              <span class="rail-dot" id="rail-dot" hidden></span>
            </button>
            <h2 id="t-facets-title"></h2>
            <button class="facets-clear" id="facets-clear" hidden></button>
          </div>
          <div class="facets-body" id="facets-body">
            <div id="facet-list"></div>
            <button class="btn facets-done" id="facets-done" hidden></button>
          </div>
        </aside>

        <div>
          <div class="chips" id="chips"></div>
          <div class="grid-head">

        </div>
      </div>

  <!-- ============ detail ============ -->
  <section class="view" id="view-detail">
    <div class="shell">
      <button class="back" onclick="closeDetail()"><span aria-hidden="true">←</span><span id="t-back"></span></button>

          </div>

      <div class="page-head">
        <span class="u-label" id="t-prod-label"></span>
        <h1 id="t-prod-title"></h1>
        <p id="t-prod-sub"></p>
      </div>
      <div class="producers" id="producers"></div>

    <div class="shell">
      <div class="page-head">
        <span class="u-label" id="t-ct-label"></span>
        <h1 id="t-ct-title"></h1>
        <p id="t-ct-sub"></p>
      </div>
      <div class="contact-grid" id="contact-body"></div>

  <!-- ============ for beekeepers ============ -->
  <section class="view" id="view-beekeep">
    <div class="shell">
      <div class="page-head">
        <span class="u-label" id="t-bk-label"></span>
        <h1 id="t-bk-title"></h1>
        <p id="t-bk-sub"></p>

      <div class="contact-grid" id="beekeep-body"></div>

    <div class="shell">
      <div class="page-head">
        <span class="u-label" id="t-tr-label"></span>
        <h1 id="t-tr-title"></h1>
        <p id="t-tr-sub"></p>
      </div>
      <div class="tform" id="transfer-body"></div>
    </div>
  </section>

  <!-- ============ cart ============ -->
  <section class="view" id="view-cart">
    <div class="shell">
      <div class="page-head">
        <span class="u-label" id="t-cart-label"></span>
        <h1 id="t-cart-title"></h1>
      </div>
      <div id="cart-body"></div>
    </div>
  </section>

  <!-- ============ editorial pages ============ -->

    <div class="shell">
      <div class="page-head">
        <span class="u-label" id="t-why-label"></span>
        <h1 id="t-why-title"></h1>
        <p id="t-why-sub"></p>
      </div>
      <div class="editorial" id="why-body"></div>

    <div class="shell">

        <span class="u-label" id="t-promise-label"></span>
        <h1 id="t-promise-title"></h1>
        <p id="t-promise-sub"></p>
      </div>
      <div class="editorial" id="promise-body"></div>
    </div>
  </section>

  <section class="view" id="view-blog">
    <div class="shell">
      <div class="page-head">
        <span class="u-label" id="t-blog-label"></span>
        <h1 id="t-blog-title"></h1>
        <p id="t-blog-sub"></p>
      </div>
      <div class="blog-soon" id="blog-body"></div>
    </div>
  </section>

</main>

<footer class="site-footer">
  <div class="news">
    <div class="news-inner">
      <div>
        <h3 id="t-news-title"></h3>

/* ============ filters ============ */
/* Each product's value(s) for a given facet group, as language-neutral keys. */
function valuesOf(p, group){
  if (group === 'origin') return [p.region.en];
  if (group === 'farm')   return [p.farm];
  return p.tastes;
}

/* Label shown for a key, in the current language. */
function labelOf(group, key){
  const t = T();
  if (group === 'origin'){
    const p = PRODUCTS.find(x => x.region.en === key);
    return p ? p.region[lang] : key;
  }
  if (group === 'farm') return key;
  return t.tastes[key] || key;
}

/* Options of a group, in the order they first appear in the catalogue. */
function optionsOf(group){
  const out = [];
  PRODUCTS.forEach(p => valuesOf(p, group).forEach(v => { if (!out.includes(v)) out.push(v); }));
  return out;
}

/* A product passes a group when nothing is picked there, or it matches one pick (OR). */
function matchesGroup(p, group){
  const sel = picked[group];
  if (!sel.size) return true;
  return valuesOf(p, group).some(v => sel.has(v));
}

/* Products passing every group except the one named — used for the option counts,
   so each number tells you what you'd get by ticking that box. */
function poolExcluding(group){
  return PRODUCTS.filter(p => FACET_GROUPS.every(g => g === group || matchesGroup(p, g)));
}

function activeCount(){
  return FACET_GROUPS.reduce((n, g) => n + picked[g].size, 0);
}

function clearFilters(){
  FACET_GROUPS.forEach(g => picked[g].clear());
  renderFilters(); renderGrid();
}

function togglePick(group, key){
  const sel = picked[group];
  sel.has(key) ? sel.delete(key) : sel.add(key);
  renderFilters(); renderGrid();
}

function renderFilters(){
  const t = T();
  const titles = { origin:t.fOrigin, taste:t.fTaste, farm:t.fFarm };

  setText('t-facets-title', t.filtersTitle);
  setText('t-facet-bar', t.filtersTitle);
  setText('facets-clear', t.filtersClear);
  setText('facets-done', t.filtersApply);
  setText('empty-clear', t.noResultsCta);
  setText('t-no-results', t.noResults);

  const n = activeCount();
  el('facets-clear').hidden = n === 0;

  const toggle = el('rail-toggle');
  toggle.setAttribute('aria-expanded', String(railOpen));
  toggle.setAttribute('aria-label', railOpen ? t.filtersHide : t.filtersShow);
  toggle.title = railOpen ? t.filtersHide : t.filtersShow;
  el('rail-dot').hidden = railOpen || n === 0;
  const bar = el('facet-bar-n');
  bar.hidden = n === 0;
  bar.textContent = n;

  /* facet groups */
  const list = el('facet-list');
  list.innerHTML = '';
  FACET_GROUPS.forEach(group => {
    const counts = {};
    poolExcluding(group).forEach(p => valuesOf(p, group).forEach(v => counts[v] = (counts[v] || 0) + 1));

    const wrap = document.createElement('section');
    wrap.className = 'facet' + (openFacets.has(group) ? '' : ' closed');

    const head = document.createElement('button');
    head.className = 'facet-head';
    head.setAttribute('aria-expanded', String(openFacets.has(group)));
    head.innerHTML = `<span>${titles[group]}</span>
      <svg class="chev" viewBox="0 0 10 10" fill="none" aria-hidden="true">
        <path d="M1 3.5 5 7l4-3.5" stroke="currentColor" stroke-width="1.4"
              stroke-linecap="round" stroke-linejoin="round"/></svg>`;
    head.onclick = () => {
      openFacets.has(group) ? openFacets.delete(group) : openFacets.add(group);
      renderFilters();
    };
    wrap.appendChild(head);

    const body = document.createElement('div');
    body.className = 'facet-body';
    optionsOf(group).forEach(key => {
      const count = counts[key] || 0;
      const on = picked[group].has(key);
      const row = document.createElement('label');
      row.className = 'opt' + (count === 0 && !on ? ' off' : '');

      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = on;
      cb.disabled = count === 0 && !on;
      cb.onchange = () => togglePick(group, key);

      const box = document.createElement('span');
      box.className = 'box';
      const txt = document.createElement('span');
      txt.textContent = labelOf(group, key);
      const num = document.createElement('span');
      num.className = 'n';
      num.textContent = count;

      row.append(cb, box, txt, num);
      body.appendChild(row);
    });
    wrap.appendChild(body);
    list.appendChild(wrap);
  });

  /* active-filter chips */
  const chips = el('chips');
  chips.innerHTML = '';
  FACET_GROUPS.forEach(group => {
    picked[group].forEach(key => {
      const c = document.createElement('button');
      c.className = 'chip';
      c.innerHTML = `<span></span><span class="x" aria-hidden="true">&times;</span>`;
      c.firstChild.textContent = labelOf(group, key);
      c.setAttribute('aria-label', `${t.filtersClear}: ${labelOf(group, key)}`);
      c.onclick = () => togglePick(group, key);
      chips.appendChild(c);
    });
  });
  if (n){
    const clear = document.createElement('button');
    clear.className = 'chips-clear';
    clear.textContent = t.filtersClear;
    clear.onclick = clearFilters;
    chips.appendChild(clear);
  }
}

/* ============ cart ============ */
/* The page ships with a stock figure per honey, and asks the server for the
   current one on load. Either way the server has the last word at checkout. */
function stockOf(id){
  const p = PRODUCTS.find(x => x.id === +id);
  return p ? (p.stock ?? 0) : 0;
}

async function loadStock(){
  try {
    const r = await fetch(CHECKOUT_API.replace('/api/checkout', '/api/stock'));
    if (!r.ok) return;
    const live = await r.json();
    PRODUCTS.forEach(p => { if (live[p.id] !== undefined) p.stock = live[p.id]; });
    // A jar that sold out while the tab was open must leave the cart too.
    Object.keys(cart).forEach(id => {
      const left = stockOf(id);
      if (left <= 0) delete cart[id];
      else if (cart[id] > left) cart[id] = left;
    });
    updateCount();
    renderFilters(); renderGrid();
  } catch (e) { /* keep the figures the page shipped with */ }
}

function addToCart(id){
  const left = stockOf(id);
  const have = cart[id] || 0;
  if (have >= left) { showToast(T().toastMax); return; }
  cart[id] = have + 1;
  updateCount();
  showToast(T().toastAdd);
}

function chQty(id, d){
  const next = cart[id] + d;
  if (d > 0 && next > stockOf(id)) { showToast(T().toastMax); return; }
  cart[id] = next;
  if (cart[id] <= 0) delete cart[id];
  updateCount();
  renderCart();
}

function updateCount(){
  const n = Object.values(cart).reduce((a, b) => a + b, 0);
  const c = el('cart-count');
  c.textContent = n;
  c.hidden = n === 0;
}

function renderCart(){
  const t = T();
  const ids = Object.keys(cart);
  const box = el('cart-body');

  if (!ids.length){
    box.innerHTML = `
      <div class="empty">
        <h3>${t.emptyTitle}</h3>
        <p>${t.emptyText}</p>
        <button class="btn btn-outline" data-nav="shop">${t.emptyCta}</button>
      </div>`;
    bindNav(box);
    return;
  }

  let subtotal = 0;
  const lines = ids.map(id => {
    const p = PRODUCTS.find(x => x.id == id);
    const q = cart[id];
    subtotal += p.price * q;
    return `
      <div class="cart-line">
        <div class="cart-tile">${p.emoji}</div>
        <div>
          <div class="cart-name">${p.name[lang]}</div>
          <div class="cart-sub">${p.farm} · ${money(p.price)}</div>
        </div>
        <div class="qty">
          <button onclick="chQty(${id},-1)" aria-label="−">−</button>
          <span>${q}</span>
          <button onclick="chQty(${id},1)" aria-label="+">+</button>
        </div>
      </div>`;
  }).join('');

  box.innerHTML = `
    <div class="cart-wrap">
      <div>${lines}</div>
      <aside class="summary">
        <h3>${t.summaryTitle}</h3>
        <div class="srow"><span>${t.subtotal}</span><span>${money(subtotal)}</span></div>
        <div class="srow free"><span>${t.shipping}</span><span>${t.shipIncluded}</span></div>
        <div class="srow total"><span>${t.total}</span><span>${money(subtotal)}</span></div>
        <button class="btn btn-solid" onclick="startCheckout()">${t.payCard}</button>
        <button class="btn btn-outline pay-alt" id="pay-transfer" onclick="showTransferForm()" hidden>${t.payTransfer}</button>
        <p class="summary-note">${t.summaryNote}</p>
      </aside>
    </div>`;

  // The summary is redrawn every time the cart changes, so the transfer button
  // has to be re-checked against what the server can actually take.
  el('pay-transfer').hidden = !PAY.bankTransfer;
}

/* ============ checkout — Stripe Checkout Session via server/ ============ */
const CHECKOUT_API = 'https://urbanbees-checkout.onrender.com/api/checkout';

async function startCheckout(){
  const btn = document.querySelector('.summary .btn');
  if (btn) { btn.disabled = true; btn.textContent = T().checkoutLoading; }
  try {
    const res = await fetch(CHECKOUT_API, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({cart, lang}),
    });
    if (!res.ok) throw new Error('checkout request failed');
    const {url} = await res.json();
    if (!url) throw new Error('no checkout url returned');
    window.location.href = url;
  } catch (err) {
    console.error(err);
    showToast(T().checkoutError);
    if (btn) { btn.disabled = false; btn.textContent = T().checkout; }
  }
}

function handleCheckoutRedirect(){
  const params = new URLSearchParams(location.search);
  if (params.has('success')) {
    cart = {};
    updateCount();
    showToast(T().checkoutSuccess);
  }
  if (params.has('success') || params.has('canceled')) {
    history.replaceState('', document.title, location.pathname + location.hash);
  }
}

/* ============ announcement bar ============ */
/* A sliding line of text cannot be read at the reader's own pace, so each
   message is held still and the next one fades in. It moves on by itself
   every seven seconds, and stops as soon as anyone looks like they are
   reading it: pointer over the bar, or keyboard focus inside it. */
let annIndex = 0, annTimer = null;
const ANN_EVERY = 7000;
const annStill = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function annShow(i, animate){
  const items = T().ticker;
  annIndex = (i + items.length) % items.length;
  const node = el('ann-text');
  const paint = () => {
    node.innerHTML = '';
    node.appendChild(document.createTextNode(items[annIndex]));
    node.insertAdjacentHTML('beforeend',
      `<svg class="arr" viewBox="0 0 14 10" fill="none" aria-hidden="true">
         <path d="M1 5h11.5M8.6 1.2 12.8 5 8.6 8.8" stroke="currentColor"
               stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`);
  };
  if (!animate) { paint(); return; }
  node.classList.add('out');
  setTimeout(() => { paint(); node.classList.remove('out'); }, 340);
}

function annStep(d){ annShow(annIndex + d, true); annStart(); }

/* True while someone is plainly reading or using the bar. Kept as state
   rather than inferred from enter/leave pairs, because a click inside the
   bar does not re-fire mouseenter and would otherwise restart the clock
   under the reader's own cursor. */
let annHeld = false;

function annStart(){
  clearInterval(annTimer);
  if (annStill || annHeld) return;      // asked not to be moved, or being read
  if (T().ticker.length < 2) return;    // nothing to step to
  annTimer = setInterval(() => annShow(annIndex + 1, true), ANN_EVERY);
}

function annHold(on){ annHeld = on; annStart(); }

function renderTicker(){
  const t = T();
  annShow(annIndex, false);
  el('ann-prev').setAttribute('aria-label', t.annPrev);
  el('ann-next').setAttribute('aria-label', t.annNext);
  document.querySelector('.announce').classList.toggle('single', t.ticker.length < 2);
  annStart();
}

function initAnnounce(){
  const bar = document.querySelector('.announce');
  el('ann-link').onclick = () => {
    showView('shop');
    el('facet-bar').scrollIntoView({ behavior: annStill ? 'auto' : 'smooth', block:'start' });
  };
  el('ann-prev').onclick = () => annStep(-1);
  el('ann-next').onclick = () => annStep(1);
  bar.addEventListener('mouseenter', () => annHold(true));
  bar.addEventListener('mouseleave', () => annHold(false));
  /* Only a keyboard landing holds it. A mouse click on an arrow leaves focus
     on that button in most browsers, and freezing the bar for the rest of the
     visit because someone once clicked it would be the wrong reading. */
  bar.addEventListener('focusin', e => {
    if (e.target.matches(':focus-visible')) annHold(true);
  });
  bar.addEventListener('focusout', () => annHold(false));
  annStart();
}

/* ============ bank transfer ============ */
/* Which payment methods the server is actually able to take. Asked once, so a
   half-configured option never reaches a customer. */
let PAY = { card: true, paypal: false, bankTransfer: false };

async function loadPaymentConfig(){
  try {
    const r = await fetch(CHECKOUT_API.replace('/api/checkout', '/api/config'));
    if (r.ok) PAY = await r.json();
  } catch (e) { /* keep the card-only default */ }
  const b = el('pay-transfer');
  if (b) b.hidden = !PAY.bankTransfer;
}

function cartTotal(){
  return Object.keys(cart).reduce((n, id) => {
    const p = PRODUCTS.find(x => x.id === +id);
    return p ? n + p.price * cart[id] : n;
  }, 0);
}

function showTransferForm(){
  const t = T();
  setText('t-tr-label', t.trLabel);
  setText('t-tr-title', t.trTitle);
  setText('t-tr-sub', t.trSub);

  const f = (id, label, opts = {}) => `
    <div class="field${opts.wide ? ' wide' : ''}">
      <label for="f-${id}">${label}</label>
      ${opts.area
        ? `<textarea id="f-${id}"></textarea>`
        : `<input id="f-${id}" type="${opts.type || 'text'}" autocomplete="${opts.ac || 'on'}">`}
    </div>`;

  el('transfer-body').innerHTML = `
    <form id="transfer-form" novalidate>
      <div class="grid">
        ${f('name',    t.fName,    { wide:true, ac:'name' })}
        ${f('email',   t.fEmail,   { type:'email', ac:'email' })}
        ${f('phone',   t.fPhone,   { type:'tel', ac:'tel' })}
        ${f('address', t.fAddress, { wide:true, ac:'street-address' })}
        ${f('zip',     t.fZip,     { ac:'postal-code' })}
        ${f('city',    t.fCity,    { ac:'address-level2' })}
        ${f('province',t.fProvince,{ ac:'address-level1' })}
        <div class="hp"><label for="f-company">Company</label><input id="f-company" tabindex="-1" autocomplete="off"></div>
        ${f('note',    t.fNote,    { wide:true, area:true })}
      </div>
      <p class="form-err" id="transfer-err" hidden></p>
      <p class="form-privacy">${t.trPrivacy}</p>
      <button class="btn btn-solid" type="submit" id="transfer-submit">${t.trSubmit}</button>
      <button class="btn btn-outline" type="button" onclick="showView('cart')">${t.trBack}</button>
    </form>`;

  el('transfer-form').onsubmit = submitTransfer;
  showView('transfer');
}

async function submitTransfer(e){
  e.preventDefault();
  const t = T();
  const v = id => (el('f-' + id).value || '').trim();
  const err = el('transfer-err');
  const btn = el('transfer-submit');

  const customer = {
    name: v('name'), email: v('email'), phone: v('phone'),
    address: v('address'), zip: v('zip'), city: v('city'),
    province: v('province'), note: v('note'),
  };

  const fail = msg => { err.textContent = msg; err.hidden = false; };
  err.hidden = true;

  if (!customer.name || !customer.email || !customer.address || !customer.zip || !customer.city) {
    return fail(t.trErrRequired);
  }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(customer.email)) return fail(t.trErrEmail);

  btn.disabled = true;
  btn.textContent = t.trSending;
  try {
    const r = await fetch(CHECKOUT_API.replace('/api/checkout', '/api/order/bank-transfer'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ cart, lang, customer, company: v('company') }),
    });
    if (!r.ok) throw new Error('order failed');
    const data = await r.json();
    showTransferDone(data);
    cart = {};
    updateCount();
  } catch (e2) {
    console.error(e2);
    fail(t.trErrGeneric);
    btn.disabled = false;
    btn.textContent = t.trSubmit;
  }
}

function showTransferDone(d){
  const t = T();
  setText('t-tr-label', t.trLabel);
  setText('t-tr-title', t.trOkTitle);
  setText('t-tr-sub', t.trOkSub);
  el('transfer-body').innerHTML = `
    <div class="bank">
      <dl>
        <dt>${t.trHolder}</dt><dd>${d.holder || ''}</dd>
        <dt>${t.trIban}</dt><dd class="mono">${d.iban || ''}</dd>
        ${d.bank ? `<dt>${t.trBank}</dt><dd>${d.bank}</dd>` : ''}
        <dt>${t.trAmount}</dt><dd>${money(d.total)}</dd>
        <dt>${t.trRef}</dt><dd class="mono ref">${d.reference}</dd>
      </dl>
    </div>
    <p>${t.trRefWarn}</p>
    <button class="btn btn-outline" onclick="showView('shop')">${t.trDone}</button>`;
  window.scrollTo(0, 0);
}

/* ============ navigation ============ */
function showView(name){
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  el('view-' + name).classList.add('active');
  const aboutViews = ['producers', 'why', 'promise'];
  document.querySelectorAll('.nav-left [data-nav]').forEach(b =>
    b.classList.toggle('on', b.dataset.nav === name));
  el('about-trigger').classList.toggle('on', aboutViews.includes(name));
  closeMenus();
  if (name === 'cart') renderCart();
  window.scrollTo(0, 0);
}

function bindNav(scope){
  scope.querySelectorAll('[data-nav]').forEach(b => {
    b.onclick = () => {
      if (location.hash) history.pushState('', document.title, location.pathname + location.search);
      showView(b.dataset.nav);
    };
  });
}

function routeHash(){
  const h = location.hash;
  if (h.startsWith('#honey-')){
    const id = +h.slice(7);
    if (PRODUCTS.some(p => p.id === id)){
      renderDetail(id);
      showView('detail');
      return;
    }
  }
  if (el('view-detail').classList.contains('active')) showView('shop');
}
window.addEventListener('hashchange', routeHash);

/* ============ menus ============ */
const aboutMenu = el('about-menu');
const langMenu = el('lang-menu');
const mobileNav = el('mobile-nav');
const menuBtn = el('menu-btn');

function closeMenus(){
  aboutMenu.classList.remove('open');
  el('about-trigger').setAttribute('aria-expanded', 'false');
  langMenu.classList.remove('open');
  el('lang-trigger').setAttribute('aria-expanded', 'false');
  mobileNav.classList.remove('open');
  menuBtn.setAttribute('aria-expanded', 'false');
}

el('about-trigger').onclick = e => {
  e.stopPropagation();
  const open = aboutMenu.classList.toggle('open');
  el('about-trigger').setAttribute('aria-expanded', String(open));
};

el('lang-trigger').onclick = e => {
  e.stopPropagation();
  const open = langMenu.classList.toggle('open');
  el('lang-trigger').setAttribute('aria-expanded', String(open));
};

menuBtn.onclick = e => {
  e.stopPropagation();
  const open = mobileNav.classList.toggle('open');
  menuBtn.setAttribute('aria-expanded', String(open));
};

document.addEventListener('click', closeMenus);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeMenus(); });

/* ============ filter drawer (mobile) ============ */
const facetBar = el('facet-bar');
const facetsBox = el('facets');

function toggleFacets(open){
  facetsBox.classList.toggle('open', open);
  facetBar.setAttribute('aria-expanded', String(open));
  el('facets-done').hidden = !open;
}

facetBar.onclick = () => toggleFacets(!facetsBox.classList.contains('open'));

el('rail-toggle').onclick = () => {
  railOpen = !railOpen;
  document.querySelector('.shop-layout').classList.toggle('rail-closed', !railOpen);
  renderFilters();
};
el('facets-done').onclick = () => {
  toggleFacets(false);
  el('facet-bar').scrollIntoView({ block:'start' });
};
el('facets-clear').onclick = clearFilters;
el('empty-clear').onclick = () => { clearFilters(); toggleFacets(false); };

/* ============ boot ============ */
bindNav(document);
setLang(lang);
initAnnounce();
routeHash();
handleCheckoutRedirect();
initNewsletter();
loadPaymentConfig();
loadStock();
</script>
