<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Urban Bees</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1c2a1f; --ink-soft:#3c4a3e;
  --honey:#d98e1f; --honey-deep:#b06f0e;
  --paper:#faf7f0; --card:#ffffff; --line:#e7e0d2; --leaf:#5a7a52;
  --display:'Fraunces',serif; --body:'Archivo',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--body);background:#11190f;color:var(--ink);display:flex;justify-content:center;align-items:flex-start}
.phone{width:100%;max-width:430px;min-height:100dvh;background:var(--paper);position:relative;display:flex;flex-direction:column;box-shadow:0 0 80px rgba(0,0,0,.5)}
.screen{flex:1;overflow-y:auto;padding-bottom:96px;display:none}
.screen.active{display:block}
.hex{clip-path:polygon(25% 3%, 75% 3%, 100% 50%, 75% 97%, 25% 97%, 0% 50%)}
.hex-frame{width:74px;height:80px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:36px;background:linear-gradient(150deg,#fff 0%,#f3ecdd 100%)}
.hex-wrap{width:80px;height:86px;flex-shrink:0;background:var(--honey);display:flex;align-items:center;justify-content:center}
.hex-wrap .hex-frame{width:74px;height:80px}
.hero{
  color:var(--paper);padding:28px 22px 30px;position:relative;overflow:hidden;
  background-image:
    linear-gradient(180deg, rgba(12,8,3,.78) 0%, rgba(12,8,3,.55) 30%, rgba(12,8,3,.32) 60%, rgba(12,8,3,.6) 100%),
    url('assets/hero-elderflower.jpg');
  background-size: 100% 100%, cover;
  background-position: 0 0, 50% 35%;
  background-repeat: no-repeat, no-repeat;
}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.brand-mark{width:34px;height:38px;background:var(--honey);display:flex;align-items:center;justify-content:center;font-size:18px}
.brand h1{font-family:var(--display);font-weight:600;font-size:22px;letter-spacing:.01em}
.langtoggle{margin-left:auto;display:flex;gap:2px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:100px;padding:3px}
.langtoggle button{background:none;border:none;color:#c8cfc4;font-family:var(--body);font-weight:700;font-size:11.5px;padding:5px 11px;border-radius:100px;cursor:pointer;letter-spacing:.04em}
.langtoggle button.on{background:var(--honey);color:var(--ink)}
.hero .tagline{font-family:var(--display);font-weight:500;font-size:30px;line-height:1.15;max-width:300px;margin-bottom:10px}
.hero .tagline em{font-style:italic;color:var(--honey)}
.hero .sub{font-size:13.5px;color:#c8cfc4;max-width:300px;line-height:1.5}
.ship-badge{display:inline-flex;align-items:center;gap:7px;margin-top:16px;background:rgba(217,142,31,.15);border:1px solid rgba(217,142,31,.45);color:var(--honey);font-size:12px;font-weight:600;letter-spacing:.04em;padding:7px 12px;border-radius:100px;text-transform:uppercase}
.backbtn{width:34px;height:34px;flex-shrink:0;border-radius:50%;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:var(--paper);font-family:var(--body);font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.backbtn:active{background:rgba(255,255,255,.22)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:18px 22px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:8px 15px;border-radius:100px;font-size:13px;font-weight:500;background:var(--card);border:1px solid var(--line);color:var(--ink-soft);cursor:pointer;font-family:var(--body);transition:all .15s}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--leaf);padding:18px 22px 10px}
.plist{padding:0 22px;display:flex;flex-direction:column;gap:12px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;gap:14px;align-items:center;cursor:pointer;transition:transform .15s}
.pcard:active{transform:scale(.985)}
.pinfo{flex:1;min-width:0}
.pregion{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--honey-deep);margin-bottom:3px}
.pname{font-family:var(--display);font-weight:600;font-size:16.5px;line-height:1.2;margin-bottom:3px}
.pfarm{font-size:12.5px;color:#7a8276;margin-bottom:8px}
.prow{display:flex;align-items:center;justify-content:space-between}
.pprice{font-weight:700;font-size:15px}
.pprice span{font-size:11.5px;font-weight:400;color:#9aa096}
.addbtn{background:var(--ink);color:var(--paper);border:none;border-radius:100px;font-family:var(--body);font-weight:600;font-size:12.5px;padding:8px 14px;cursor:pointer;transition:background .15s}
.addbtn:active{background:var(--honey-deep)}
.addbtn.added{background:var(--leaf)}
.fcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin:0 22px 12px;display:flex;gap:16px;align-items:flex-start}
.fbody h3{font-family:var(--display);font-weight:600;font-size:17px;margin-bottom:2px}
.floc{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--honey-deep);margin-bottom:8px}
.fdesc{font-size:13.5px;line-height:1.5;color:var(--ink-soft)}
.fstats{display:flex;gap:14px;margin-top:10px}
.fstat{font-size:12px;color:#7a8276}
.fstat b{color:var(--ink);font-weight:700}
.cart-empty{padding:60px 32px;text-align:center}
.cart-empty .big{font-size:44px;margin-bottom:14px}
.cart-empty h3{font-family:var(--display);font-weight:600;font-size:20px;margin-bottom:8px}
.cart-empty p{font-size:14px;color:#7a8276;line-height:1.5}
.citem{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:0 22px 10px}
.citem .hex-frame{width:50px;height:54px;font-size:24px}
.cinfo{flex:1}
.cinfo .n{font-family:var(--display);font-weight:600;font-size:14.5px}
.cinfo .f{font-size:12px;color:#7a8276}
.qty{display:flex;align-items:center;gap:10px}
.qty button{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:var(--paper);font-size:15px;cursor:pointer;color:var(--ink);line-height:1}
.qty span{font-weight:700;font-size:14px;min-width:16px;text-align:center}
.summary{margin:16px 22px;background:var(--ink);color:var(--paper);border-radius:18px;padding:20px}
.srow{display:flex;justify-content:space-between;font-size:14px;margin-bottom:8px;color:#c8cfc4}
.srow.ship{color:var(--honey)}
.srow.tot{font-weight:700;font-size:17px;color:var(--paper);margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.15)}
.checkout{width:100%;margin-top:16px;background:var(--honey);color:var(--ink);border:none;border-radius:100px;padding:14px;font-family:var(--body);font-weight:700;font-size:15px;cursor:pointer}
.checkout:active{background:var(--honey-deep);color:var(--paper)}
.checkout:disabled{opacity:.6;cursor:default}
.ship-note{font-size:12px;color:#9aa096;text-align:center;margin:14px 32px 0;line-height:1.5}
.dhex-wrap{display:flex;justify-content:center;margin:-34px 0 6px}
.dhex-wrap .hex-wrap{width:96px;height:104px}
.dhex-wrap .hex-frame{width:88px;height:96px;font-size:44px}
.dpricebar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 22px 6px;padding:14px 16px;background:var(--card);border:1px solid var(--line);border-radius:16px}
.dprice{font-family:var(--display);font-weight:700;font-size:20px}
.dprice span{display:block;font-size:11.5px;font-weight:400;color:#9aa096;font-family:var(--body)}
.chargrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 22px}
.charcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.charlabel{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--leaf);margin-bottom:4px}
.charvalue{font-size:13px;font-weight:600;line-height:1.35}
.ddesc-block{margin:0 22px 14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.ddesc-block h4{font-family:var(--display);font-weight:600;font-size:15px;margin-bottom:8px}
.ddesc-block p{font-size:13.5px;line-height:1.55;color:var(--ink-soft)}
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:rgba(250,247,240,.92);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:10px 0 max(14px, env(safe-area-inset-bottom));z-index:50}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;cursor:pointer;font-family:var(--body);font-size:11px;font-weight:600;color:#9aa096;position:relative;width:80px}
.tab .ico{font-size:21px;filter:grayscale(1);opacity:.55;transition:all .15s}
.tab.on{color:var(--ink)}
.tab.on .ico{filter:none;opacity:1}
.badge{position:absolute;top:-4px;right:18px;background:var(--honey);color:var(--ink);font-size:10px;font-weight:700;min-width:17px;height:17px;border-radius:100px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);font-size:13px;font-weight:600;padding:10px 18px;border-radius:100px;opacity:0;pointer-events:none;transition:all .25s;z-index:60;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

/* ============ Desktop / wide-viewport layout ============ */
@media (min-width: 860px){
  .phone{max-width:none;border-radius:0;box-shadow:none}
  .screen{padding-bottom:110px}
  .hero{padding:52px 56px 44px}
  .brand{margin-bottom:30px}
  .brand h1{font-size:26px}
  .hero .tagline{font-size:42px;max-width:620px}
  .hero .sub{font-size:15px;max-width:520px}
  .chips{padding:26px 56px 8px}
  .eyebrow{padding:22px 56px 14px;font-size:12px}
  .plist{max-width:1600px;margin:0 auto;padding:0 56px;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
  .pcard{transition:transform .15s,box-shadow .15s}
  .pcard:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(28,42,31,.1)}
  #flist{max-width:1600px;margin:0 auto;padding:0 56px;display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:18px}
  .fcard{margin:0}
  #cartbody{max-width:640px;margin:0 auto}
  #screen-detail>.dpricebar,#screen-detail>.chargrid,#screen-detail>.ddesc-block{max-width:640px;margin-left:auto;margin-right:auto}
  .tabbar{max-width:480px;bottom:24px;border-radius:100px;border:1px solid var(--line)}
}
</style>
</head>
<body>
<div class="phone">

  <div class="screen active" id="screen-shop">

  <nav class="tabbar">
    <button class="tab on" data-tab="shop"><span class="ico">🍯</span><span id="t-tab-shop"></span></button>

  <div class="toast" id="toast"></div>
</div>

   crystal:{it:'Molto lenta — resta liquido per anni',en:'Very slow — stays liquid for years'},

  {id:3, emoji:'🌳', price:26.00, farm:'Apiario Sardo Antico',

/* ============ State ============ */
let lang = 'en';
let cart = {};
let activeCat = null;
let currentDetailId = null;

const T = () => I18N[lang];
const money = v => '€' + v.toFixed(2).replace('.', T().dec);

function setLang(l){
  lang = l;
  document.documentElement.lang = l;
  renderStatic(); renderChips(); renderProducts(); renderFarmers();
  if(document.getElementById('screen-cart').classList.contains('active')) renderCart();
  if(document.getElementById('screen-detail').classList.contains('active') && currentDetailId!=null) renderDetail(currentDetailId);
}

function renderStatic(){
  const t = T();
  document.getElementById('lang-it').classList.toggle('on', lang==='it');
  document.getElementById('lang-en').classList.toggle('on', lang==='en');
  document.getElementById('t-tagline').innerHTML = t.tagline;
  document.getElementById('t-sub').textContent = t.sub;
  document.getElementById('t-shipbadge').textContent = t.shipbadge;
  document.getElementById('t-eyebrow').textContent = t.eyebrow;
  document.getElementById('t-farmers-title').innerHTML = t.farmersTitle;
  document.getElementById('t-farmers-sub').textContent = t.farmersSub;
  document.getElementById('t-cart-title').innerHTML = t.cartTitle;
  document.getElementById('t-tab-shop').textContent = t.tabShop;
  document.getElementById('t-tab-farmers').textContent = t.tabFarmers;
  document.getElementById('t-tab-cart').textContent = t.tabCart;
}

function renderChips(){
  const t = T();
  if(activeCat===null || activeCat==='__all__') activeCat='__all__';
  const cats = [...new Set(PRODUCTS.map(p=>p.cat[lang]))];
  const el = document.getElementById('chips');
  el.innerHTML='';
  const mk = (label, key)=>{
    const b=document.createElement('button');
    b.className='chip'+(key===activeCat?' on':'');
    b.textContent=label;
    b.onclick=()=>{activeCat=key;renderChips();renderProducts();};
    el.appendChild(b);
  };
  mk(t.all,'__all__');
  cats.forEach(c=>mk(c,c));
  if(activeCat!=='__all__' && !cats.includes(activeCat)){activeCat='__all__';renderChips();}
}

function renderProducts(){
  const t = T();
  const el=document.getElementById('plist');
  el.innerHTML='';
  PRODUCTS.filter(p=>activeCat==='__all__'||p.cat[lang]===activeCat).forEach(p=>{
    const d=document.createElement('div');
    d.className='pcard';
    d.innerHTML=`
      <div class="hex-wrap hex"><div class="hex-frame hex">${p.emoji}</div></div>
      <div class="pinfo">
        <div class="pregion">${p.region[lang]}</div>
        <div class="pname">${p.name[lang]}</div>
        <div class="pfarm">${p.farm}</div>
        <div class="prow">
          <div class="pprice">${money(p.price)} <span>/ ${p.unit[lang]}</span></div>
          <button class="addbtn" data-id="${p.id}">${t.add}</button>
        </div>
      </div>`;
    d.onclick=()=>openDetail(p.id);
    el.appendChild(d);
  });
  el.querySelectorAll('.addbtn').forEach(b=>{
    b.onclick=(e)=>{
      e.stopPropagation();
      addToCart(+b.dataset.id);
      b.textContent=T().added;b.classList.add('added');
      setTimeout(()=>{b.textContent=T().add;b.classList.remove('added');},1200);
    };
  });
}

function renderFarmers(){
  const t = T();
  const el=document.getElementById('flist');
  el.innerHTML='';
  FARMERS.forEach(f=>{
    const d=document.createElement('div');
    d.className='fcard';
    d.innerHTML=`
      <div class="hex-wrap hex" style="width:64px;height:70px"><div class="hex-frame hex" style="width:58px;height:64px;font-size:28px">${f.emoji}</div></div>
      <div class="fbody">
        <h3>${f.name}</h3>
        <div class="floc">${f.loc[lang]}</div>
        <p class="fdesc">${f.desc[lang]}</p>
        <div class="fstats">
          <div class="fstat"><b>${f.products}</b> ${f.products===1?t.product:t.products}</div>
          <div class="fstat">★ <b>${f.rating[lang]}</b></div>
          <div class="fstat" style="color:var(--leaf);font-weight:600">✓ ${t.verified}</div>
        </div>
      </div>`;
    el.appendChild(d);
  });
}

/* ============ Honey detail page (linked via #honey-<id>) ============ */
function openDetail(id){
  location.hash = 'honey-'+id;
}
function closeDetail(){
  if(location.hash){ history.back(); } else { switchTab('shop'); }
}
function renderDetail(id){
  const p = PRODUCTS.find(x=>x.id===id);
  if(!p) return;
  currentDetailId = id;
  const t = T();
  document.getElementById('d-name').innerHTML = p.name[lang];
  document.getElementById('d-farm').textContent = p.farm+' · '+p.region[lang];
  document.getElementById('d-emoji').innerHTML = `<div class="hex-wrap hex"><div class="hex-frame hex">${p.emoji}</div></div>`;
  document.getElementById('d-price').innerHTML = `${money(p.price)}<span>${p.unit[lang]}</span>`;
  const btn = document.getElementById('d-addbtn');
  btn.textContent = t.add;
  btn.classList.remove('added');
  btn.onclick = ()=>{
    addToCart(p.id);
    btn.textContent = T().added; btn.classList.add('added');
    setTimeout(()=>{btn.textContent=T().add;btn.classList.remove('added');},1200);
  };
  document.getElementById('d-chars').innerHTML = `
    <div class="charcard"><div class="charlabel">${t.charColor}</div><div class="charvalue">${p.color[lang]}</div></div>
    <div class="charcard"><div class="charlabel">${t.charHarvest}</div><div class="charvalue">${p.harvest[lang]}</div></div>
    <div class="charcard"><div class="charlabel">${t.charCrystal}</div><div class="charvalue">${p.crystal[lang]}</div></div>
    <div class="charcard"><div class="charlabel">${t.charFlavor}</div><div class="charvalue">${p.flavor[lang]}</div></div>`;
  document.getElementById('d-about').innerHTML = `<h4>${t.aboutTitle}</h4><p>${p.desc[lang]}</p>`;
  document.getElementById('d-pairing').innerHTML = `<h4>${t.pairingTitle}</h4><p>${p.pairing[lang]}</p>`;
}
function showDetailScreen(){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-detail').classList.add('active');
}
function routeHash(){
  const h = location.hash;
  if(h.startsWith('#honey-')){
    const id = +h.slice(7);
    if(PRODUCTS.some(p=>p.id===id)){
      renderDetail(id);
      showDetailScreen();
      return;
    }
  }
  if(document.getElementById('screen-detail').classList.contains('active')){
    switchTab('shop');
  }
}
window.addEventListener('hashchange', routeHash);

function addToCart(id){
  cart[id]=(cart[id]||0)+1;
  updateBadge();
  showToast(T().toastAdd);
}
function updateBadge(){
  const n=Object.values(cart).reduce((a,b)=>a+b,0);
  const b=document.getElementById('badge');
  b.style.display=n?'flex':'none';
  b.textContent=n;
}
let toastTimer;
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),1400);
}

function renderCart(){
  const t = T();
  const el=document.getElementById('cartbody');
  const ids=Object.keys(cart);
  if(!ids.length){
    el.innerHTML=`<div class="cart-empty"><div class="big">🧺</div><h3>${t.emptyTitle}</h3><p>${t.emptyText}</p></div>`;
    return;
  }
  let html='', subtotal=0;
  ids.forEach(id=>{
    const p=PRODUCTS.find(x=>x.id==id);
    const q=cart[id];
    subtotal+=p.price*q;
    html+=`<div class="citem">
      <div class="hex-frame hex">${p.emoji}</div>
      <div class="cinfo"><div class="n">${p.name[lang]}</div><div class="f">${p.farm} · ${money(p.price)}</div></div>
      <div class="qty">
        <button onclick="chQty(${id},-1)" aria-label="−">−</button><span>${q}</span>
        <button onclick="chQty(${id},1)" aria-label="+">+</button>
      </div>
    </div>`;
  });
  html+=`<div class="summary">
    <div class="srow"><span>${t.subtotal}</span><span>${money(subtotal)}</span></div>
    <div class="srow ship"><span>${t.shipping}</span><span>${t.shipIncluded}</span></div>
    <div class="srow tot"><span>${t.total}</span><span>${money(subtotal)}</span></div>
    <button class="checkout" onclick="startCheckout()">${t.checkout}</button>
  </div>
  <p class="ship-note">${t.shipNote}</p>`;
  el.innerHTML=html;
}
function chQty(id,d){
  cart[id]+=d;
  if(cart[id]<=0)delete cart[id];
  updateBadge();renderCart();
}

/* ============ Checkout — Stripe Checkout Session via server/ ============ */
const CHECKOUT_API = 'https://urbanbees-checkout.onrender.com/api/checkout';

async function startCheckout(){
  const btn = document.querySelector('.checkout');
  if (btn) { btn.disabled = true; btn.textContent = T().checkoutLoading; }
  try {
    const res = await fetch(CHECKOUT_API, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({cart, lang}),
    });
    if (!res.ok) throw new Error('checkout request failed');
    const {url} = await res.json();
    if (!url) throw new Error('no checkout url returned');
    window.location.href = url;
  } catch (err) {
    console.error(err);
    showToast(T().checkoutError);
    if (btn) { btn.disabled = false; btn.textContent = T().checkout; }
  }
}

function handleCheckoutRedirect(){
  const params = new URLSearchParams(location.search);
  if (params.has('success')) {
    cart = {};
    updateBadge();
    showToast(T().checkoutSuccess);
  }
  if (params.has('success') || params.has('canceled')) {
    history.replaceState('', document.title, location.pathname + location.hash);
  }
}

/* tabs */
function switchTab(name){
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on', x.dataset.tab===name));
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+name).classList.add('active');
  if(name==='cart') renderCart();
}
document.querySelectorAll('.tab').forEach(t=>{
  t.onclick=()=>{
    if(location.hash) history.pushState('', document.title, window.location.pathname+window.location.search);
    switchTab(t.dataset.tab);
  };
});

setLang(lang);
routeHash();
handleCheckoutRedirect();
</script>
